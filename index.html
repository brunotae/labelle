<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA BELLE 여정</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LA BELLE">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#09060A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Pen+Script&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#09060A; --s1:#140D16; --s2:#1E1421; --s3:#2A1C2D; --line:#3A2433;
  --text:#FFF4F9; --muted:#C3A9B9; --dim:#8E7486;
  --pink:#FF2E8B; --pink2:#FF7CC0; --paper:#FFE6F1; --warm:#FFB37A;
  --grad:linear-gradient(100deg,#FF2E8B 0%,#FF5FA8 55%,#FF8CC6 100%);
  --ok:#5BE3A8; --warn:#FFC266;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text)}
body{font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}

/* glows */
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.glow i:nth-child(1){width:340px;height:340px;left:-120px;top:-110px;background:#FF2E8B;opacity:.35}
.glow i:nth-child(2){width:300px;height:300px;right:-120px;top:120px;background:#FFB37A;opacity:.22}
.glow i:nth-child(3){width:380px;height:380px;left:20%;bottom:-200px;background:#B5177A;opacity:.3}

.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:18px 16px 60px}

/* header */
.kicker{display:inline-block;position:relative;font-weight:700;font-size:13px;color:#fff;padding:3px 14px 4px;margin-bottom:6px}
.kicker::before{content:"";position:absolute;inset:0;background:var(--grad);transform:skew(-10deg) rotate(-1.5deg);
  border-radius:3px 10px 4px 12px;z-index:-1;box-shadow:0 0 22px rgba(255,46,139,.45)}
.title{font-weight:900;font-size:40px;letter-spacing:.02em;line-height:1;margin:2px 0 0}
.title .ol{color:transparent;-webkit-text-stroke:1.6px var(--pink2);margin-left:8px}
.script{font-family:'Dancing Script',cursive;color:var(--pink2);font-size:24px;line-height:1.1;transform:rotate(-3deg);display:inline-block}
.logo{display:block;color:inherit;text-decoration:none;cursor:pointer}
.logo:active{opacity:.75}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.next{margin-top:10px;font-size:13px;color:var(--muted)}
.next b{color:var(--text);font-weight:700}

/* tabs */
.tabs{display:flex;gap:8px;margin:18px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 22px rgba(255,46,139,.35)}

/* cards */
.card{background:rgba(30,20,33,.72);border:1px solid var(--line);border-radius:20px;padding:16px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.stack>*+*{margin-top:12px}
.h2{font-weight:900;font-size:18px;margin:0 0 10px}
.h3{font-weight:700;font-size:13px;color:var(--pink2);letter-spacing:.04em;margin:0 0 8px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{text-align:left;padding:14px;border-radius:18px;background:rgba(30,20,33,.72);border:1px solid var(--line);min-height:44px}
.stat .n{font-weight:900;font-size:30px;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset,0 8px 26px rgba(255,46,139,.25)}
.stat.on .n{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* patient cards */
.plist{display:grid;gap:10px;margin-top:14px}
@media(min-width:720px){.plist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc{text-align:left;width:100%;display:block}
.pc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc .nm{font-weight:900;font-size:18px}
.code{font-size:11px;color:var(--dim);letter-spacing:.05em}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,46,139,.16);color:var(--pink2);border:1px solid rgba(255,46,139,.35);white-space:nowrap}
.pill.gray{background:var(--s3);color:var(--muted);border-color:var(--line)}
.pill.ok{background:rgba(91,227,168,.12);color:var(--ok);border-color:rgba(91,227,168,.35)}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:9px;background:var(--s3);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.nx{font-size:13px;margin-top:10px}
.nx b{color:var(--pink2)}

.empty{text-align:center;padding:30px 16px}
.empty .pen{font-family:'Nanum Pen Script',cursive;font-size:30px;color:var(--pink2);line-height:1.15}

/* buttons */
.btn{white-space:nowrap;min-height:46px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--s3);border:1px solid var(--line)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(255,46,139,.32)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,80,110,.12);border-color:rgba(255,80,110,.45);color:#FF8FA6}
.btn.danger.arm{background:#E0244F;color:#fff;border-color:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.brow.end{justify-content:flex-end}

/* forms */
.f{margin-bottom:14px}
.f label.lb{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f label.lb em{color:var(--pink);font-style:normal}
.in{width:100%;min-height:46px;border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:10px 14px;outline:none}
.in:focus{border-color:var(--pink)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:44px;padding:0 15px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted)}
.chip.on{background:rgba(255,46,139,.18);border-color:var(--pink);color:#fff;font-weight:700}
.chips.small .chip{min-height:38px;padding:0 12px;font-size:13px}
.confirm{font-size:12.5px;color:var(--pink2);margin-top:5px;min-height:18px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:520px){.g3{grid-template-columns:minmax(0,1fr)}}
.warnbox{background:rgba(255,194,102,.1);border:1px solid rgba(255,194,102,.4);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);font-weight:700}
.dhead .nm{font-weight:900;font-size:28px;line-height:1.15}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{min-height:36px;padding:0 11px;border-radius:999px;font-size:12.5px;background:var(--s1);border:1px solid var(--line);color:var(--dim)}
.step.done{color:var(--muted);border-color:#5a3049}
.step.cur{background:var(--grad);color:#fff;border-color:transparent;font-weight:700}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:14px}
.kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-word}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 10px;background:var(--pink)}
.ev .body{flex:1;min-width:0;text-align:left}
.ev .t1{font-weight:700}
.ev .t2{font-size:13px;color:var(--muted)}
.ev.done .t1{text-decoration:line-through;color:var(--dim)}
.tick{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--dim);font-size:12px;font-weight:700}
.tick.on{background:rgba(91,227,168,.14);border-color:rgba(91,227,168,.5);color:var(--ok)}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sc{padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13px}
.sc b{display:block;font-size:12px;color:var(--pink2)}
.sc.past{opacity:.5}
.sc.today{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.log{font-size:12.5px;color:var(--muted);max-height:220px;overflow:auto}
.log div{padding:5px 0;border-top:1px dashed var(--line)}
.log div:first-child{border-top:0}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money .m{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px}
.money .m b{display:block;font-size:16px;font-weight:900}
.money .m span{font-size:12px;color:var(--dim)}
.dgrid{display:grid;gap:12px}
@media(min-width:820px){.dgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}}

/* calendar */
.calwrap{display:grid;gap:12px}
@media(min-width:820px){.calwrap{grid-template-columns:330px minmax(0,1fr);align-items:start}}
.cals{display:grid;gap:12px}
@media(max-width:819px){.cals{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:560px){.cals{grid-template-columns:minmax(0,1fr)}}
.mcal .mh{font-weight:900;margin-bottom:6px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:12.5px}
.mgrid .wd{color:var(--dim);font-size:11px;padding:2px 0}
.dcell{position:relative;min-height:36px;border-radius:10px;color:var(--muted)}
.dcell.has::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--pink)}
.dcell.today{color:#fff;font-weight:900;box-shadow:0 0 0 1px var(--line) inset}
.dcell.sel{background:var(--grad);color:#fff;font-weight:900}
.dcell.sel::after{background:#fff}

/* patient view */
.pv{position:fixed;inset:0;z-index:20;background:#0B070C;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pv .sky{position:absolute;left:0;right:0;top:0;height:300px;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,179,122,.32) 0%,rgba(255,46,139,.22) 45%,rgba(11,7,12,0) 100%)}
.pv .in2{position:relative;max-width:440px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
.pv .hello{font-weight:900;font-size:26px;line-height:1.2;margin-top:4px}
.pv .pen{font-family:'Nanum Pen Script',cursive;font-size:24px;color:var(--paper);line-height:1.15;margin-top:8px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--pink),rgba(255,46,139,.1))}
.tli{position:relative;padding:0 0 14px}
.tli::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--pink)}
.tli.done::before{background:var(--pink)}
.tli .d{font-size:12px;color:var(--pink2);font-weight:700}
.tli .w{font-weight:700}
.tli .p{font-size:13px;color:var(--muted)}
.chg{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:#E0244F;border-radius:999px;padding:1px 8px;vertical-align:2px}
.ring{display:flex;align-items:center;gap:14px}
.ring .pct{font-weight:900;font-size:34px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* auth */
.auth{max-width:400px;margin:8vh auto 0}
.auth .pen{font-family:'Nanum Pen Script',cursive;font-size:28px;color:var(--pink2);line-height:1.15;margin:16px 0 18px}

/* medical files */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.fc .th{display:block;width:100%;aspect-ratio:5/6;object-fit:cover;background:#1a1218}
.fc .th.doc{aspect-ratio:5/4}
.fc .fb{padding:9px 10px 10px;font-size:12.5px}
.fc .ft{font-weight:700;font-size:13.5px;line-height:1.3}
.fc .fr{display:flex;gap:6px;margin-top:8px}
.fc .fr .btn{flex:1;min-height:36px;padding:0 8px;font-size:12px}
.share{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--s3);color:var(--dim);display:inline-block;margin-top:5px}
.share.on{background:rgba(91,227,168,.12);color:var(--ok)}
.req{display:flex;flex-wrap:wrap;gap:6px}
.rq{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 6px 0 12px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--s1)}
.rq.ok{color:var(--ok);border-color:rgba(91,227,168,.4);padding-right:12px}
.rq.miss{color:var(--warn);border-color:rgba(255,194,102,.45)}
.rq button{min-height:28px;padding:0 10px;border-radius:999px;background:rgba(255,194,102,.16);color:var(--warn);font-size:11.5px;font-weight:700}
.cmp{position:relative;width:100%;max-width:420px;aspect-ratio:5/6;border-radius:18px;overflow:hidden;margin:6px auto 0;border:1px solid var(--line);touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.cmp .top{clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px rgba(255,46,139,.8);pointer-events:none}
.cmp .ln::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--grad);color:#fff;font-weight:900;font-size:14px;border-radius:999px;padding:6px 10px;white-space:nowrap}
.cmp .tg{position:absolute;top:10px;font-family:'Dancing Script',cursive;font-size:22px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.lbx{position:fixed;inset:0;z-index:30;background:#09060A;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px 30px}
.lbx .box{width:100%;max-width:520px}
.lbx img{width:100%;border-radius:18px;border:1px solid var(--line);display:block}
.demo-note{font-size:12px;color:var(--warn);background:rgba(255,194,102,.08);border:1px dashed rgba(255,194,102,.4);border-radius:12px;padding:8px 10px;margin-top:8px}
/* v1.6 */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--s3);border:2px solid rgba(255,46,139,.55);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--pink2);overflow:hidden}
.av.lg{width:72px;height:72px;font-size:24px}
.avwrap{position:relative;display:inline-block;cursor:pointer;flex:0 0 auto}
.avwrap .cam{position:absolute;right:-4px;bottom:-4px;background:var(--grad);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px;white-space:nowrap}
.pchead{display:flex;gap:12px;align-items:center;min-width:0}
.stp{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;margin-top:14px}
.sn{aspect-ratio:1/1;min-width:0;padding:0;border-radius:50%;font-size:11px;font-weight:700;background:var(--s1);border:1px solid var(--line);color:var(--dim);line-height:1}
.sn.done{background:rgba(255,46,139,.22);border-color:transparent;color:#FFD0E6}
.sn.cur{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 0 12px rgba(255,46,139,.55)}
.stpl{margin-top:8px;font-size:14px}
.stpl b{font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.codebox{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--s3);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.agnew{background:var(--s1);border:1px dashed var(--line);border-radius:14px;padding:10px;margin-top:8px}
.fileline{font-size:12.5px;color:var(--muted);margin-top:6px}
.fc .th.doc{object-fit:cover}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  background:#fff;color:#1a0f17;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.4)}
.foot{margin-top:18px;font-size:12.5px;color:var(--dim)}
.sep{height:1px;background:var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="glow"><i></i><i></i><i></i></div>

<div class="wrap">
  <!-- AUTH -->
  <section id="auth" class="auth" hidden>
    <span class="kicker">글로벌 의료관광</span>
    <h1 class="title">LA BELLE<span class="ol">LB</span></h1>
    <div class="script">My Medical Journey</div>
    <div class="pen">“새로운 나, 새로운 시작.”<br>환자 여정 통합관리</div>
    <div class="card">
      <div class="f"><label class="lb">아이디 또는 이메일</label><input id="aEmail" class="in" type="text" autocapitalize="none" autocorrect="off" autocomplete="username"></div>
      <div class="f"><label class="lb">비밀번호</label><input id="aPass" class="in" type="password" autocomplete="current-password"></div>
      <div class="dim small" style="margin:-4px 0 8px">앱 버전 <span id="aVer"></span></div><div id="aMsg" class="small" style="color:var(--pink2);min-height:20px;margin-bottom:8px"></div>
      <div class="brow"><button id="aIn" class="btn pri" style="flex:1">로그인</button><button id="aUp" class="btn">계정 만들기</button></div>
    </div>
  </section>

  <!-- APP -->
  <section id="app" hidden>
    <header>
      <div class="hrow">
        <a href="./" id="logo" class="logo" aria-label="처음 화면으로">
          <span class="kicker">글로벌 의료관광</span>
          <h1 class="title">LA BELLE<span class="ol">LB</span></h1>
        </a>
        <div class="script">Real Story · Real Change</div>
      </div>
      <div id="me" class="next" style="margin-top:4px"></div><div id="next" class="next"></div>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab" data-t="home">환자 여정</button>
      <button class="tab" data-t="new">+ 신규 환자</button>
      <button class="tab" data-t="cal">일정</button>
      <button class="tab" data-t="hist">기록</button>
    </nav>

const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

/* ---------- storage ---------- */
S.urls={};S.urlPending=new Set();
const urlOf=p=>(S.urls[p]&&S.urls[p].exp>Date.now())?S.urls[p].url:"";
async function fetchUrls(paths){
  paths=[...new Set(paths)].filter(p=>p&&!urlOf(p)&&!S.urlPending.has(p));if(!paths.length)return false;
  paths.forEach(p=>S.urlPending.add(p));
  let res;try{res=await sb.storage.from(BUCKET).createSignedUrls(paths,3600)}catch(e){res={error:e}}
  paths.forEach(p=>S.urlPending.delete(p));
  if(res.error||!res.data)return false;
  res.data.forEach(d=>{if(d.signedUrl)S.urls[d.path]={url:d.signedUrl,exp:Date.now()+3300e3}});return true;
}
function paintUrls(){document.querySelectorAll("img[data-path]").forEach(i=>{const u=urlOf(i.dataset.path);if(u&&i.getAttribute("src")!==u)i.src=u})}
function wantUrls(){const ps=[...document.querySelectorAll("img[data-path]")].map(i=>i.dataset.path);paintUrls();fetchUrls(ps).then(ok=>{if(ok)paintUrls()})}
const isImg=f=>/^image\//.test(f.mime||"")||/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name||"");
const fmtSize=b=>!b?"":b>1048576?(b/1048576).toFixed(1)+"MB":Math.max(1,Math.round(b/1024))+"KB";
function storageErr(e){const m=(e&&e.message||"")+"";return /bucket|not found|policy|row-level|security/i.test(m)?"Supabase에 labelle_v16.sql을 먼저 실행해 주세요.":"업로드 실패: "+m}
async function upFile(r,file,prefix=""){
  const safe=(file.name||"file").replace(/[^\w.\-]+/g,"_").slice(-60);
  const path=`${r.id}/${prefix}${Date.now()}-${uid()}-${safe}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
  if(error)throw error;return path;
}
async function shrink(file,max=640){
  if(!/^image\//.test(file.type||""))return file;
  try{const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);const b=await new Promise(res=>c.toBlob(res,"image/jpeg",.86));return b?new File([b],"profile.jpg",{type:"image/jpeg"}):file}catch(e){return file}
}
function avatar(r,lg){const ini=esc((r.name||"?").trim().slice(0,1).toUpperCase());
  return r.profile_path?`<img class="av ${lg?"lg":""}" data-path="${esc(r.profile_path)}" alt="">`:`<span class="av ${lg?"lg":""}">${ini}</span>`}
async function setProfile(r,file){
  if(!file)return;toast("사진 올리는 중…");
  try{const small=await shrink(file);const path=await upFile(r,small,"profile-");const old=r.profile_path;
    if(await patch(r,{profile_path:path},"프로필 사진 변경")){if(old)sb.storage.from(BUCKET).remove([old]);toast("프로필 사진이 저장되었습니다.");render()}
  }catch(e){toast(storageErr(e))}
}

async function signIn(up){
  let email=$("#aEmail").value.trim().toLowerCase();const password=$("#aPass").value;
  if(email&&!email.includes("@"))email+=LOGIN_DOMAIN;
  if(up&&password.length<6){$("#aMsg").textContent="비밀번호는 6자 이상이어야 합니다.";return}
  if(!email||!password){$("#aMsg").textContent="이메일과 비밀번호를 입력하세요.";return}
  $("#aMsg").textContent="확인 중…";
  const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){const m=(r.error.message||"").toLowerCase();
    $("#aMsg").textContent=up?(m.includes("registered")||m.includes("exists")?"이미 있는 계정입니다. 로그인을 눌러 주세요.":m.includes("signup")||m.includes("not allowed")?"새 계정 만들기가 꺼져 있습니다. 관리자에게 요청하세요.":"계정을 만들 수 없습니다: "+r.error.message)
      :(m.includes("invalid")?"아이디 또는 비밀번호가 맞지 않습니다. 처음이라면 ‘계정 만들기’를 누르세요.":m.includes("confirm")?"이메일 인증이 필요합니다. 관리자에게 요청하세요.":"로그인 실패: "+r.error.message);
    console.log("auth error",email,r.error);return}
  S.user=r.data.user||r.data.session?.user;showApp();
}

/* ---------- data ---------- */
async function load(){
  const {data,error}=await sb.from(T).select("*").order("created_at",{ascending:false});
  if(error){toast("불러오기 실패: "+error.message);return}
  S.rows=(data||[]).map(r=>({...r,events:r.events||[],log:r.log||[],files:r.files||[]}));
  const ag=await sb.from("labelle_agencies").select("*").order("name",{ascending:true});
  S.agencies=ag.error?[]:(ag.data||[]);
}
async function patch(r,p,logText){
  if(logText){p.log=[{at:nowStamp(),text:logText+(S.user?" · "+who():"")},...(r.log||[])].slice(0,200)}
  const {error}=await sb.from(T).update(p).eq("id",r.id);
  if(error){toast(/column|files|schema/i.test(error.message||"")?"Supabase에 labelle_v16.sql을 먼저 실행해 주세요.":"저장 실패: "+error.message);return false}
  Object.assign(r,p);return true;
}
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&S.user&&!busy()){await load();render()}});
setInterval(async()=>{if(S.user&&!document.hidden&&!busy()){await load();render()}},60000);
function busy(){return S.tab==="new"||S.editing||S.evAdd||S.evEdit||S.fAdd||!$("#lbx").hidden}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab&&!S.openId));

  const m=$("#main");
  if(S.openId&&byId(S.openId)){m.innerHTML=detailHTML(byId(S.openId));bindDetail();wantUrls();return}
  S.openId=null;
  if(S.tab==="home")m.innerHTML=homeHTML();
  else if(S.tab==="new")m.innerHTML=formHTML(null);
  else if(S.tab==="cal")m.innerHTML=calHTML();
  else m.innerHTML=histHTML();
  bindMain();wantUrls();
}
function renderMe(){$("#me").innerHTML=S.me?`<span class="pill" style="margin-right:6px">${esc(S.me.role||"ADM")}</span>${esc(who())}`:`<span class="pill gray" style="margin-right:6px">권한 없음</span>${esc(who())} · 관리자에게 권한을 요청하세요`}
function renderNext(){renderMe();
  const t=today();let best=null;
  active().forEach(r=>(r.events||[]).forEach(e=>{if(!e.done&&e.date>=t&&(!best||evSort(e,best.e)<0))best={e,r}}));
  $("#next").innerHTML=best?`다음 일정 · <b>${fD(best.e.date)} ${fT(best.e.time)}</b> ${esc(best.e.type)} · ${esc(best.r.name)}`:`오늘은 ${fFull(t)}`;
}

/* ---------- home ---------- */
function homeHTML(){
  const a=active();
  const stats=GROUPS.slice(1).map(g=>`<button class="stat ${S.group===g.k?"on":""}" data-g="${g.k}"><div class="n">${a.filter(r=>g.f(r.stage||0)).length}</div><div class="l">${g.l}</div></button>`).join("");
  const g=GROUPS.find(x=>x.k===S.group)||GROUPS[0];
  const key=r=>{const e=nextEvent(r);return e?"0"+e.date+(e.time||"99"):r.status==="canceled"?"9":"5"+String(99-(r.stage||0)).padStart(2,"0")};
  const list=a.filter(r=>g.f(r.stage||0)).sort((x,y)=>key(x).localeCompare(key(y)));
  let body;
  if(!a.length){
    body=`<div class="card empty"><div class="pen">한 사람의 이야기가<br>새로운 시작이 됩니다.</div><p class="muted small">아직 등록된 환자가 없습니다.</p>
    <div class="brow" style="justify-content:center"><button class="btn pri" data-go="new">+ 첫 환자 등록</button><button class="btn" id="seed">샘플 환자 보기</button></div></div>`;
  }else if(!list.length){body=`<div class="card empty muted">이 단계의 환자가 없습니다.</div>`}
  else body=`<div class="plist">${list.map(cardHTML).join("")}</div>`;
  return `<div class="stats">${stats}</div>
  ${S.group!=="all"?`<div style="margin-top:10px"><button class="chip" data-g="all">← 전체 보기</button></div>`:""}
  ${body}`;
}
function cardHTML(r){

  ${S.agNew?`<div class="agnew"><div class="g2"><div class="f" style="margin:0"><label class="lb">에이전시 이름</label><input id="agName" class="in" placeholder="예: 울란바토르 Gerege"></div>

function readForm(){
  const pick=f=>{const b=document.querySelector(`.chips[data-field="${f}"] .chip.on`);return b?b.dataset.v:null};
  const num=id=>{const x=$(id).value.replace(/[^\d]/g,"");return x?Number(x):null};
  return {name:$("#fName").value.trim(),nationality:pick("nationality"),language:pick("language"),contact:$("#fContact").value.trim()||null,
    counselor:$("#fCounselor").value.trim()||null,department:pick("department"),procedure:$("#fProc").value.trim()||null,hospital:$("#fHosp").value.trim()||null,
    interpreter:$("#fInterp").value.trim()||null,program:$("#fProgram").value.trim()||null,
    payment_method:[...document.querySelectorAll('.chips[data-field="payment_method"] .chip.on')].map(b=>b.dataset.v).join(", ")||null,
    agency:(pick("agency")&&pick("agency")!=="직접 유치")?pick("agency"):null,
    source:pick("source"),stage:Number(pick("stage")||0),
    arrival_date:$("#fArr").value||null,surgery_date:$("#fSurg").value||null,departure_date:$("#fDep").value||null,
    quote_krw:num("#fQuote"),paid_krw:num("#fPaid"),notes:$("#fNotes").value.trim()||null};
}
function bindForm(r){
  const always=["stage","evtype","fkind","agency"];
  const prev=()=>{const cp=$("#codePrev");if(!cp||(r&&r.patient_code))return;
    const nat=document.querySelector('.chips[data-field="nationality"] .chip.on')?.dataset.v;const ag=document.querySelector('.chips[data-field="agency"] .chip.on')?.dataset.v;
    cp.textContent=nextCode(codePrefix(nat,agCode(ag)))};
  const bindChips=()=>document.querySelectorAll(".chips").forEach(g=>g.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;
    if(g.classList.contains("multi")){b.classList.toggle("on");return}
    const was=b.classList.contains("on");g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    if(!was||always.includes(g.dataset.field))b.classList.add("on");prev()});
  bindChips();prev();
  const bindAg=()=>{
    const o=$("#agOpen");if(o)o.onclick=()=>{S.agNew=true;redrawAg()};
    const c=$("#agCancel");if(c)c.onclick=()=>{S.agNew=false;redrawAg()};
    const sv2=$("#agSave");if(sv2)sv2.onclick=async()=>{
      const name=$("#agName").value.trim(),cd=$("#agCode").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(!name||cd.length<2){toast("이름과 코드(영문 2~4자)를 입력하세요.");return}
      if(agencyList().some(a=>a.code===cd)||cd==="LB"){toast("이미 사용 중인 코드입니다.");return}
      const nat=document.querySelector('.chips[data-field="nationality"] .chip.on')?.dataset.v||null;
      const {data,error}=await sb.from("labelle_agencies").insert({name,code:cd,country:nat}).select().single();
      if(error){toast(/relation|exist|schema/i.test(error.message)?"Supabase에 labelle_v16.sql을 먼저 실행해 주세요.":"저장 실패: "+error.message);return}
      S.agencies=[...(S.agencies||[]),data];S.agNew=false;redrawAg(name);toast("에이전시가 추가되었습니다.");
    }};
  const redrawAg=(sel)=>{const box=$("#agBox");if(!box)return;const cur=sel||document.querySelector('.chips[data-field="agency"] .chip.on')?.dataset.v;
    box.innerHTML=agencyBox({agency:cur==="직접 유치"?null:cur});bindChips();bindAg();prev()};
  bindAg();
  document.querySelectorAll("input.dt").forEach(i=>i.oninput=()=>{const c=document.querySelector(`.confirm[data-for="${i.id}"]`);if(c)c.textContent=i.value?"→ "+fFull(i.value):""});
  const sv=$("#fSave");if(!sv)return;
  sv.onclick=async()=>{
    const v=readForm();
    if(!v.name){toast("이름을 입력하세요.");$("#fName").focus();return}
    if(!r){
      const dup=active().find(x=>x.name.trim().toLowerCase()===v.name.toLowerCase()||(v.contact&&x.contact===v.contact));
      if(dup&&!S.dupArm){S.dupArm=true;$("#dupWarn").innerHTML=`<div class="warnbox">이미 등록된 환자와 비슷합니다: <b>${esc(dup.name)}</b> (${code(dup)}). 그래도 등록하려면 저장을 한 번 더 누르세요.</div>`;scrollTo(0,0);return}
      sv.disabled=true;
      const prefix=codePrefix(v.nationality,agCode(v.agency));v.agency_code=v.agency?agCode(v.agency):null;
      let data,error;
      for(let k=0;k<4;k++){v.patient_code=nextCode(prefix,k);
        ({data,error}=await sb.from(T).insert({...v,events:[],log:[{at:nowStamp(),text:`환자 등록 · ${v.patient_code} · ${who()}`}],status:"active"}).select().single());
        if(!error||!/duplicate|unique/i.test(error.message||""))break}
      if(error){sv.disabled=false;toast(/column|schema/i.test(error.message||"")?"Supabase에 labelle_v16.sql을 먼저 실행해 주세요.":"저장 실패: "+error.message);return}
      const row={...data,events:data.events||[],log:data.log||[],files:data.files||[]};S.rows.unshift(row);S.dupArm=false;
      const ph=$("#fPhoto")?.files?.[0],att=[...($("#fAttach")?.files||[])],ak=$("#fAttKind")?.value||"기타";
      if(ph)await setProfile(row,ph);
      if(att.length)await addFiles(row,att,{kind:ak,date:today(),title:"",note:""});
      sv.disabled=false;
      toast(`등록되었습니다 · ${row.patient_code}`);S.tab="home";S.openId=data.id;render();scrollTo(0,0);
    }else{
      const ch=[];if(v.stage!==(r.stage||0))ch.push(`단계: ${STAGES[r.stage||0]} → ${STAGES[v.stage]}`);
      [["surgery_date","수술일"],["arrival_date","입국일"],["departure_date","출국일"]].forEach(([k,l])=>{if((v[k]||null)!==(r[k]||null))ch.push(`${l}: ${r[k]?fD(r[k]):"없음"} → ${v[k]?fD(v[k]):"없음"}`)});
      if(!r.patient_code){v.patient_code=nextCode(codePrefix(v.nationality,agCode(v.agency)));ch.push("코드 발급 "+v.patient_code)}
      v.agency_code=v.agency?agCode(v.agency):null;
      const att=[...($("#fAttach")?.files||[])],ak=$("#fAttKind")?.value||"기타";
      if(await patch(r,v,"정보 수정"+(ch.length?" · "+ch.join(", "):""))){if(att.length)await addFiles(r,att,{kind:ak,date:today(),title:"",note:""});S.editing=false;toast("저장되었습니다.");render()}
    }
  };
  const c=$("#fClose");if(c)c.onclick=()=>{S.editing=false;render()};
}

async function addFiles(r,list,meta){

    toast(`업로드 중 ${i}/${list.length} · ${file.name}`);
    try{const path=await upFile(r,file);ok.push({id:uid(),kind:meta.kind,date:meta.date,title:meta.title&&list.length===1?meta.title:(meta.title?meta.title+" "+i:file.name),note:meta.note,shared:false,path,name:file.name,size:file.size,mime:file.type||""})}
    catch(e){toast(storageErr(e));return false}
  }
  if(!ok.length)return false;
  return await patch(r,{files:[...(r.files||[]),...ok]},`파일 첨부 ${ok.length}개: ${ok.map(f=>f.title).join(", ").slice(0,80)} (${meta.kind})`);

function openPV(r){
  const pv=$("#pv"),t=today(),s=r.stage||0,pct=Math.round((s+1)/STAGES.length*100);

  const todays=evs.filter(e=>e.date===t),up=evs.filter(e=>e.date>=t);
  const changed=evs.filter(e=>e.changed&&!e.ack);
  let nextPre=null;if(r.surgery_date){for(const[o,l]of PRE){const d=addDays(r.surgery_date,o);if(d>=t){nextPre={d,l,o};break}}}
  pv.innerHTML=`<div class="sky"></div><div class="in2">
   <div style="display:flex;justify-content:space-between;align-items:center"><a href="./" id="pvLogo" class="kicker" style="text-decoration:none" aria-label="처음 화면으로">LA BELLE LB</a><button class="btn sm" id="pvClose">닫기</button></div>

   <div class="card" style="margin-top:12px"><div class="h3">오늘의 일정 · ${fD(t)}</div>

/* ---------- calendar ---------- */
function allItems(){
  const out=[];
  active().forEach(r=>{(r.events||[]).forEach(e=>out.push({date:e.date,time:e.time,type:e.type,place:e.place,staff:e.staff,done:e.done,r}));
    if(r.surgery_date)FU.forEach(([m])=>out.push({date:addMonths(r.surgery_date,m),time:"",type:`사후관리 ${m}개월`,place:"",staff:r.counselor,r,fu:true}));});
  return out;
}
function monthHTML(y,m,days){
  const first=new Date(y,m,1),start=first.getDay(),n=new Date(y,m+1,0).getDate(),t=today();
  let c=WD.map(w=>`<div class="wd">${w}</div>`).join("");for(let i=0;i<start;i++)c+="<div></div>";
  for(let d=1;d<=n;d++){const s=`${y}-${pad(m+1)}-${pad(d)}`;c+=`<button class="dcell ${days.has(s)?"has":""} ${s===t?"today":""} ${s===S.calSel?"sel":""}" data-day="${s}">${d}</button>`}
  return `<div class="card mcal"><div class="mh">${y}년 ${m+1}월</div><div class="mgrid">${c}</div></div>`;
}
function calHTML(){
  if(!S.calSel)S.calSel=today();
  const base=S.calBase?pd(S.calBase):pd(today());base.setDate(1);
  const items=allItems(),days=new Set(items.map(i=>i.date));
  const b2=new Date(base.getFullYear(),base.getMonth()+1,1);
  const list=items.filter(i=>i.date===S.calSel).sort(evSort);
  const up=items.filter(i=>i.date>S.calSel&&!i.done).sort(evSort).slice(0,6);
  const row=i=>`<button class="ev" style="width:100%" data-open="${i.r.id}"><span class="dot" style="background:${i.fu?"#5BE3A8":EVCOL[i.type]||"var(--pink)"}"></span><span class="body"><span class="t1" style="display:block">${fT(i.time)||"종일"} · ${esc(i.type)}</span><span class="t2" style="display:block">${esc(i.r.name)}${i.place?" · "+esc(i.place):""}${i.staff?" · 담당 "+esc(i.staff):""}</span></span></button>`;
  return `<div class="calwrap">
    <div><div class="brow" style="margin-bottom:10px"><button class="btn sm" id="cPrev">← 이전</button><button class="btn sm" id="cToday">오늘</button><button class="btn sm" id="cNext">다음 →</button></div>
    <div class="cals">${monthHTML(base.getFullYear(),base.getMonth(),days)}${monthHTML(b2.getFullYear(),b2.getMonth(),days)}</div></div>
    <div class="stack">
      <div class="card"><div class="h3">${fFull(S.calSel)}</div>${list.length?list.map(row).join(""):`<div class="dim small">이 날은 일정이 없습니다.</div>`}</div>
      <div class="card"><div class="h3">이후 일정</div>${up.length?up.map(i=>`<div class="dim small" style="margin-top:6px">${fD(i.date)}</div>`+row(i)).join(""):`<div class="dim small">예정된 일정이 없습니다.</div>`}</div>
    </div></div>`;
}

/* ---------- history ---------- */
function histHTML(){
  const f={all:()=>true,on:r=>r.status!=="canceled"&&(r.stage||0)<12,done:r=>r.status!=="canceled"&&r.stage===12,canceled:r=>r.status==="canceled"}[S.hist];
  const list=S.rows.filter(f);
  return `<div class="chips" style="margin-bottom:12px">${[["all","전체"],["on","진행 중"],["done","완료"],["canceled","취소"]].map(([k,l])=>`<button class="chip ${S.hist===k?"on":""}" data-h="${k}">${l} ${S.rows.filter({all:()=>true,on:r=>r.status!=="canceled"&&(r.stage||0)<12,done:r=>r.status!=="canceled"&&r.stage===12,canceled:r=>r.status==="canceled"}[k]).length}</button>`).join("")}</div>
  <div class="card">${list.length?list.map(r=>`<div class="ev"><div class="body" style="cursor:pointer" data-open="${r.id}"><div class="t1">${esc(r.name)} <span class="code">${code(r)}</span></div>
    <div class="t2">${r.status==="canceled"?"취소됨 · "+(r.canceled_at?fD(r.canceled_at.slice(0,10)):""):STAGES[r.stage||0]} · 등록 ${r.created_at?fD(r.created_at.slice(0,10)):""}</div></div>
    ${r.status==="canceled"?`<button class="btn sm" data-react="${r.id}">다시 활성화</button>`:""}</div>`).join(""):`<div class="dim small">기록이 없습니다.</div>`}</div>
  <div class="foot">
    <div>연결 계정 · ${esc(who())} ${S.me?"("+esc(S.me.role)+")":""} · 앱 버전 ${VERSION}</div>
    <div class="brow" style="margin-top:10px"><button class="btn sm" id="bk">백업 복사</button><button class="btn sm" id="seed">샘플 환자 추가</button><button class="btn sm ghost" id="lo">로그아웃</button></div>
    <p class="small">샘플 환자는 모두 가상의 인물입니다. 실제 환자 개인정보·의료자료는 보안 설정을 갖춘 정식 버전에서만 입력하세요.</p>
  </div>`;
}

/* ---------- main binds ---------- */
function bindMain(){
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.group=S.group===b.dataset.g?"all":b.dataset.g;render()});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.fAdd=false;S.fGroup="전체";S.cmpAfter=null;S.openId=b.dataset.open;S.editing=false;S.arm=null;render();scrollTo(0,0)});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.go;render()});
  if(S.tab==="new")bindForm(null);
  if(S.tab==="cal"){
    document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{S.calSel=b.dataset.day;render()});
    const mv=n=>{const d=S.calBase?pd(S.calBase):pd(today());d.setDate(1);d.setMonth(d.getMonth()+n);S.calBase=iso(d);render()};
    $("#cPrev").onclick=()=>mv(-1);$("#cNext").onclick=()=>mv(1);$("#cToday").onclick=()=>{S.calBase=null;S.calSel=today();render()};
  }
  if(S.tab==="hist"){
    document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{S.hist=b.dataset.h;render()});
    document.querySelectorAll("[data-react]").forEach(b=>b.onclick=async()=>{const r=byId(b.dataset.react);if(await patch(r,{status:"active",canceled_at:null},"다시 활성화")){toast("다시 활성화되었습니다.");render()}});
    $("#bk").onclick=async()=>{const txt=JSON.stringify(S.rows,null,1);try{await navigator.clipboard.writeText(txt);toast("백업이 복사되었습니다.")}catch(e){toast("복사할 수 없습니다.")}};
    $("#lo").onclick=async()=>{await sb.auth.signOut();S.user=null;S.me=null;S.rows=[];$("#app").hidden=true;$("#auth").hidden=false;$("#aMsg").textContent=""};
  }
  const sd=$("#seed");if(sd)sd.onclick=seed;
}
