<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>청담도화 · CHEONGDAM DOHWA</title>
<meta name="description" content="청담도화 — 한국의 뷰티 · 의료 · 웰니스 여정. by LA BELLE LB">
<meta name="theme-color" content="#F7F3EC">
<link rel="icon" href="img/dh/icon.svg" type="image/svg+xml">
<link rel="icon" href="img/dh/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/dh/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;600&family=Noto+Serif:wght@400;500&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--iv:#F7F3EC;--paper:#FFFDF9;--bg2:#F1EBE1;--bu:#6B1E33;--bu2:#55152A;--ink:#2A2421;--mu:#857A71;--line:#E5DCD0;--gold:#B39B74;
 --serif:'Noto Serif KR','Noto Serif',serif;--sans:'Noto Sans KR','Noto Sans',system-ui,sans-serif;--w:1120px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--iv);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:var(--w);margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(247,243,236,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo svg{width:28px;height:28px}
.logo b{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.06em;line-height:1}
.logo small{display:block;font-size:8.5px;letter-spacing:.28em;color:var(--mu);margin-top:3px;font-weight:500}
nav.mn{display:flex;gap:4px;margin:0 auto}
nav.mn a{padding:8px 14px;font-size:14px;color:#4A403A;border-radius:999px}
nav.mn a:hover,nav.mn a.on{color:var(--bu)}
nav.mn a.on{font-weight:700}
.hr{display:flex;align-items:center;gap:10px;flex:none}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 30px 7px 32px;font-size:13px;cursor:pointer}
.lang svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;pointer-events:none}
.lang:after{content:"";position:absolute;right:13px;top:45%;width:6px;height:6px;border-right:1.5px solid var(--mu);border-bottom:1.5px solid var(--mu);transform:translateY(-50%) rotate(45deg);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:2px;border:1px solid var(--bu);background:var(--bu);color:#fff;font-size:14px;font-weight:500;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bu2)}
.btn.ghost{background:transparent;color:var(--bu)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.arr{display:inline-block;width:14px;height:10px}
/* hero */
.hero{position:relative;height:clamp(360px,34vw,440px);overflow:hidden;background:#EFE6DA}
.hero picture,.hero>picture img{position:absolute;inset:0;width:100%;height:100%}
.hero>picture img{object-fit:cover;object-position:75% 30%}
.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(247,243,236,.96) 0%,rgba(247,243,236,.86) 30%,rgba(247,243,236,0) 56%)}
.htx{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;max-width:var(--w);margin:0 auto;padding:0 20px}
.htx h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.2vw,50px);line-height:1.22;letter-spacing:-.01em;max-width:520px}
.htx .sub{margin:14px 0 22px;font-size:16px;color:#4A403A;letter-spacing:.04em}
.srch{display:flex;max-width:500px;background:var(--paper);border:1px solid #D6CABA;box-shadow:0 8px 30px rgba(60,40,20,.06)}
.srch label{flex:1;display:flex;align-items:center;gap:10px;padding:0 14px}
.srch input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;height:48px;outline:none;color:var(--ink)}
.srch .btn{min-height:48px;border-radius:0}
.tags{margin-top:20px;font-size:10.5px;letter-spacing:.3em;color:var(--mu)}
.ai{position:absolute;right:10px;bottom:10px;z-index:3;font-size:10px;line-height:1;padding:4px 8px;border-radius:999px;background:rgba(30,24,16,.42);color:#fff;letter-spacing:.02em}
/* categories */
.cats{display:grid;grid-template-columns:repeat(6,1fr);padding:30px 0 6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:none;border:0;border-left:1px solid var(--line);cursor:pointer;text-align:center}
.cat:first-child{border-left:0}
.cat svg{width:48px;height:40px;stroke:var(--bu);stroke-width:1.25;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px;transition:transform .2s}
.cat:hover svg{transform:translateY(-2px)}
.cat b{font-weight:500;font-size:14px}
.cat span{font-size:12px;color:var(--mu)}
/* sections */
.sec{padding:34px 0 8px}
.sh{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.sh h2{margin:0;font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.01em;white-space:nowrap}
.sh i{flex:1;height:1px;background:#CDBFAE}
.sh a{font-size:13px;color:var(--bu);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{display:block;align-self:start;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.ph{position:relative;overflow:hidden;background:var(--bg2)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .ph img{transform:scale(1.03)}
.r1 .ph{aspect-ratio:220/170}.r2 .ph{aspect-ratio:297/180}.r3 .ph{aspect-ratio:220/120}
.ct{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 2px 0}
.ct b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;margin-bottom:3px}
.ct span{display:block;font-size:13px;color:var(--mu);line-height:1.55}
.ct .arr{margin-top:8px;flex:none;color:#5A4E46}
.cap{font-size:12.5px;color:#5A4E46;text-align:center;padding-top:8px}
.note{font-size:12px;color:var(--mu);margin:12px 0 0}
/* consult banner */
.cb{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;margin:40px 0 10px;min-height:120px;padding:20px 40px 20px 34%;background:#F1ECE4;overflow:hidden}
.cb img{position:absolute;left:0;top:0;height:100%;width:34%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
.cb h3{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:24px}
.cb p{margin:0;font-size:14px;color:#5A4E46}
.cb.right{padding:26px 34% 26px 50px}
.cb.right img{left:auto;right:0;-webkit-mask-image:linear-gradient(270deg,#000 70%,transparent);mask-image:linear-gradient(270deg,#000 70%,transparent)}
.cb.right .btn{border-radius:999px}
/* programs page */
.ptop{text-align:center;padding:46px 0 10px}
.ptop h1{margin:0;font-family:var(--serif);font-weight:400;font-size:44px;letter-spacing:.02em}
.ptop p{margin:8px 0 0;font-size:16px;color:#5A4E46}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:26px 0 8px}
.tabs button{border:0;background:none;padding:6px 20px;font-size:14px;cursor:pointer;color:#4A403A;position:relative;border-radius:999px}
.tabs button+button:before{content:"";position:absolute;left:-3px;top:25%;height:50%;width:1px;background:#CDBFAE}
.tabs button.on{background:var(--bu);color:#fff}
.tabs button.on:before,.tabs button.on+button:before{display:none}
.chipq{display:flex;justify-content:center;margin:6px 0 14px}
.chipq span{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:5px 8px 5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.chipq button{border:0;background:var(--bg2);width:22px;height:22px;border-radius:99px;cursor:pointer;line-height:1}
.pk{background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;text-align:left;cursor:pointer;padding:0;width:100%}
.pk .ph{aspect-ratio:228/250}
.pkb{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.pkb .dd{font-size:11.5px;color:var(--gold);letter-spacing:.06em}
.pkb b{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.3;margin:2px 0 6px}
.pkb .ds{font-size:12.5px;color:var(--mu);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.pkb hr{width:36px;border:0;border-top:1px solid #CDBFAE;margin:12px 0}
.pkf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.pr{font-size:13px}.pr small{color:var(--mu);margin-right:3px}.pr strong{font-weight:700}
.off{font-size:11px;color:var(--bu);border:1px solid #E3CDD2;padding:1px 7px;border-radius:999px}
.more{font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-top:10px}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}
/* modal */
.mdl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(42,30,24,.45)}
.mdl[hidden]{display:none}
.mbox{position:relative;background:var(--paper);width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;grid-template-columns:300px minmax(0,1fr)}
.mbox.wide{grid-template-columns:minmax(0,1fr)}
.mbox .ph{aspect-ratio:auto;min-height:340px}
.mtx{padding:28px 28px 24px}
.mtx .dd{font-size:12px;color:var(--gold);letter-spacing:.06em}
.mtx h3{margin:2px 0 10px;font-family:var(--serif);font-weight:500;font-size:26px}
.mtx p{margin:0 0 12px;font-size:14px;line-height:1.75}
.mtx ul,.mtx ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.8}
.mx{position:absolute;right:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:99px;border:0;background:rgba(255,255,255,.9);cursor:pointer;font-size:18px}
.chk{list-style:none;padding:0!important}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk input{accent-color:var(--bu);width:17px;height:17px;margin-top:4px;flex:none}
.small{font-size:12px;color:var(--mu)}
/* footer */
footer{margin-top:44px;border-top:1px solid var(--line);padding:22px 0 34px}
.ft{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.ft .logo b{font-size:18px}
.ft .by{font-size:12px;color:var(--mu);margin-left:6px}
.fl{display:flex;gap:16px;font-size:12px;color:#5A4E46;flex-wrap:wrap}
.fl a{cursor:pointer}
.disc{font-size:11.5px;color:var(--mu);margin:14px 0 0;line-height:1.7}
.mcta{display:none}
@media (max-width:980px){
 nav.mn{display:none}.g4{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(3,1fr);row-gap:8px}.cat:nth-child(4){border-left:0}
}
@media (max-width:720px){
 body{font-size:14px}
 .hd{height:58px;gap:10px}.logo b{font-size:19px}.logo svg{width:24px;height:24px}.hr{margin-left:auto}
 .lang select{padding:6px 26px 6px 28px;font-size:12px}.lang svg{left:9px}
 .hero{height:auto;background:none}
 .hero:before{display:none}
 .hero>picture{position:relative;display:block;height:auto}
 .hero>picture img{position:relative;height:250px;object-position:80% 25%}
 .htx{height:auto;padding:22px 20px 6px}
 .htx h1{font-size:31px}.htx .sub{margin:10px 0 16px;font-size:14.5px}
 .srch{flex-direction:column;border:0;background:none;box-shadow:none;gap:8px}
 .srch label{background:var(--paper);border:1px solid #D6CABA}
 .tags{margin-top:14px;letter-spacing:.22em}
 .hero .ai{top:212px;bottom:auto}
 .sec{padding:26px 0 4px}.sh{margin-bottom:12px;gap:10px}.sh h2{font-size:21px}
 .g3{grid-template-columns:minmax(0,1fr);gap:18px}.g3.r2{grid-template-columns:minmax(0,1fr)}
 .g4{gap:12px}.ct b{font-size:16px}.ct span{font-size:12px}
 .cb,.cb.right{grid-template-columns:minmax(0,1fr);padding:20px;min-height:0;text-align:left}
 .cb img,.cb.right img{position:relative;width:100%;height:110px;-webkit-mask-image:none;mask-image:none;margin:-20px -20px 4px;width:calc(100% + 40px);max-width:none}
 .cb h3{font-size:20px}
 .ptop{padding:30px 0 4px}.ptop h1{font-size:32px}.ptop p{font-size:14px}
 .tabs button{padding:6px 14px}
 .pkb{padding:12px 12px 14px}.pkb b{font-size:16px}.pkb .ds{font-size:11.5px;min-height:35px}.pkf{flex-wrap:wrap}
 .mbox{grid-template-columns:minmax(0,1fr)}.mbox .ph{aspect-ratio:4/3;min-height:0}.mtx{padding:20px}
 .mcta{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 10px 30px rgba(60,20,30,.25)}
 footer{padding-bottom:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 for(let i=0;i<5;i++)s+=`<ellipse cx="50" cy="25.6" rx="17.76" ry="20.16" fill="${col}" stroke="${center}" stroke-width="3.2" transform="rotate(${i*72} 50 52)"/>`;

 skin:'<path d="M24 4c5 7 9 12 9 17a9 9 0 0 1-18 0c0-5 4-10 9-17z"/><path d="M19.5 22.5a4.5 4.5 0 0 0 3 4"/>',

 wellness:'<path d="M24 31S9 22.5 9 13.5A7.5 7.5 0 0 1 24 10a7.5 7.5 0 0 1 15 3.5C39 22.5 24 31 24 31z"/>',

ko:{nav:["프로그램","뷰티 가이드","의료기관","상담하기"],h1:"당신의 매력이<br>피어나는 곳.",sub:"한국의 뷰티 · 의료 · 웰니스 여정",ph:"어떤 여정을 꿈꾸시나요?",start:"상담 시작하기",ai:"연출 이미지",
 cats:[["페이스 케어","더 조화로운 나"],["피부 케어","건강한 아름다움"],["치아 케어","자신 있는 미소"],["바디 & 웰니스","균형 있는 라이프"],["헤어 케어","건강한 변화"],["스파 & 힐링","온전한 휴식"]],

const THEMES=[["t-glow","skin"],["t-color","beauty"],["t-well","wellness"],["t-seoul","@travel"]];
const CATK=["face","skin","dental","wellness","hair","spa"];
/* ---------- state ---------- */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const LANGS=["mn","ko","en","zh","pt"];
function pickLang(){const q=new URLSearchParams(location.search).get("l");if(LANGS.includes(q))return q;const s=LS.get("dh-lang");if(LANGS.includes(s))return s;
 const n=(navigator.language||"").slice(0,2).toLowerCase();return LANGS.includes(n)?n:"mn"}
let L=pickLang();const t=()=>T[L];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>"₩"+n.toLocaleString("ko-KR");
const formURL=p=>"index.html?form=1&l="+L+"&src=dohwa"+(p?"&p="+encodeURIComponent(p):"");
const img=(k,alt="",eager)=>`<img src="img/dh/${k}.jpg" alt="${esc(alt)}" ${eager?"":'loading="lazy"'} decoding="async">`;
/* ---------- views ---------- */
function pkCard(p){const x=t();return `<button class="pk" data-pk="${p.id}"><div class="ph">${img(p.img,p.n[L])}</div><div class="pkb"><span class="dd">${p.d}${L==="ko"||L==="zh"?x.day:" "+x.day}</span><b>${esc(p.n[L])}</b><span class="ds">${esc(p.t[L])}</span><hr>
 <div class="pkf"><span class="pr"><small>${esc(x.from)}</small><strong>${won(p.krw)}</strong></span><span class="off">-${p.off}%</span></div><span class="more">${esc(x.more)} ${ARR}</span></div></button>`}
function home(){const x=t();
 return `<section class="hero"><picture><source media="(max-width:720px)" srcset="img/dh/hero-m.jpg"><img src="img/dh/hero.jpg" alt="" fetchpriority="high"></picture><span class="ai">${esc(x.ai)}</span>
  <div class="htx"><h1>${x.h1}</h1><p class="sub">${esc(x.sub)}</p>
   <form class="srch" id="srch" role="search"><label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E55" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="sr">${esc(x.search)}</span><input id="q" type="search" placeholder="${esc(x.ph)}" autocomplete="off"></label>
   <a class="btn" href="${formURL()}">${esc(x.start)} ${ARR}</a></form>
   <div class="tags">BEAUTY · MEDICAL · WELLNESS · SEOUL</div></div></section>
 <div class="wrap">
  <div class="cats">${CATK.map((k,i)=>`<button class="cat" data-cat="${k}">${ic(k)}<b>${esc(x.cats[i][0])}</b><span>${esc(x.cats[i][1])}</span></button>`).join("")}</div>
  <section class="sec"><div class="sh"><h2>${esc(x.journey)}</h2><i></i><a href="#/programs">${esc(x.allP)} ${ARR}</a></div>
   <div class="g4 r1">${THEMES.map(([im,go],i)=>`<button class="card" data-theme="${go}"><div class="ph">${img(im,x.themes[i][0])}</div><div class="ct"><div><b>${esc(x.themes[i][0])}</b><span>${esc(x.themes[i][1])}</span></div>${ARR}</div></button>`).join("")}</div></section>
  <section class="sec" id="guides"><div class="sh"><h2>${esc(x.guide)}</h2><i></i><a href="#/guides">${esc(x.allG)} ${ARR}</a></div>
   <div class="g3 r2">${Object.entries(GD).map(([k,g])=>`<button class="card" data-guide="${k}"><div class="ph">${img(g.img,g[L][0])}</div><div class="ct"><div><b>${esc(g[L][0])}</b><span>${esc(g[L][1])}</span></div>${ARR}</div></button>`).join("")}</div></section>
  <section class="sec" id="clinics"><div class="sh"><h2>${esc(x.clinics)}</h2><i></i></div>
   <div class="g4 r3">${[1,2,3,4].map(i=>`<div><div class="ph">${img("c"+i,x.clinicCap)}<span class="ai">${esc(x.ai)}</span></div><div class="cap">${esc(x.clinicCap)}</div></div>`).join("")}</div>
   <p class="note">${esc(x.clinicNote)}</p></section>
  <section class="cb">${img("b-home")}<div><h3>${esc(x.cbT)}</h3><p>${esc(x.cbP)}</p></div><a class="btn" href="${formURL()}">${esc(x.consult)} ${ARR}</a></section>
 </div>`}
let F={tab:"all",feat:null,q:""};
function matches(p){const q=F.q.trim().toLowerCase();
 if(F.tab!=="all"&&!p.cat.includes(F.tab))return false;if(F.feat&&!p.cat.includes(F.feat))return false;
 if(q){const hay=[p.n[L],p.t[L],p.n.ko,p.t.ko,p.n.en].join(" ").toLowerCase();return q.split(/\s+/).every(w=>hay.includes(w))}return true}
function programs(){const x=t();const list=PK.filter(matches);
 return `<div class="wrap"><div class="ptop"><h1>${esc(x.pTitle)}</h1><p>${esc(x.pSub)}</p></div>
  <div class="tabs" role="tablist">${Object.entries(x.tabs).map(([k,v])=>`<button role="tab" aria-selected="${F.tab===k}" class="${F.tab===k?"on":""}" data-tab="${k}">${esc(v)}</button>`).join("")}</div>
  ${F.feat||F.q?`<div class="chipq"><span>${esc(F.feat?x.feat[F.feat]||x.tabs[F.feat]:"")}${F.feat&&F.q?" · ":""}${F.q?"“"+esc(F.q)+"”":""}<button data-clr aria-label="${esc(x.clear)}">×</button></span></div>`:""}
  ${list.length?`<div class="g4">${list.map(pkCard).join("")}</div>`:`<div class="empty"><p>${esc(x.none)}</p><a class="btn" href="${formURL(F.q||(F.feat?x.feat[F.feat]:""))}">${esc(x.consult)} ${ARR}</a></div>`}
  <p class="note" style="text-align:center">${esc(x.imgNote)}<br>${esc(x.priceNote)}</p>
  <section class="cb right">${img("b-pkg")}<div><h3>${esc(x.pbT)}</h3></div><a class="btn" href="${formURL()}">${esc(x.consult)} ${ARR}</a></section></div>`}
function guides(){const x=t();return `<div class="wrap"><div class="ptop"><h1>${esc(x.guide)}</h1></div><div class="g3 r2" style="margin-top:20px">${Object.entries(GD).map(([k,g])=>`<button class="card" data-guide="${k}"><div class="ph">${img(g.img,g[L][0])}</div><div class="ct"><div><b>${esc(g[L][0])}</b><span>${esc(g[L][1])}</span></div>${ARR}</div></button>`).join("")}</div>
 <section class="cb">${img("b-home")}<div><h3>${esc(x.cbT)}</h3><p>${esc(x.cbP)}</p></div><a class="btn" href="${formURL()}">${esc(x.consult)} ${ARR}</a></section></div>`}
/* ---------- modal ---------- */
const mdl=document.getElementById("mdl"),mbox=document.getElementById("mbox");let lastFocus=null;
function openModal(html,wide){lastFocus=document.activeElement;mbox.className="mbox"+(wide?" wide":"");mbox.innerHTML=html+`<button class="mx" data-x aria-label="${esc(t().close)}">×</button>`;mdl.hidden=false;document.body.style.overflow="hidden";mbox.querySelector(".mx").focus()}
function closeModal(){if(mdl.hidden)return;mdl.hidden=true;document.body.style.overflow="";const h=location.hash;if(/^#\/(p|g)\//.test(h))history.replaceState(null,"",h.startsWith("#/p/")?"#/programs":"#/guides");if(lastFocus)lastFocus.focus()}
function showPk(id){const p=PK.find(x=>x.id===id);if(!p)return;const x=t();
 openModal(`<div class="ph">${img(p.img,p.n[L],1)}<span class="ai">${esc(x.ai)}</span></div><div class="mtx"><span class="dd">${p.d}${L==="ko"||L==="zh"?x.day:" "+x.day}</span><h3>${esc(p.n[L])}</h3>
  <p>${esc(p.t[L])}</p><p class="pr"><small>${esc(x.from)}</small> <strong style="font-size:20px">${won(p.krw)}</strong> <span class="off">-${p.off}%</span></p>
  <p class="small">${esc(x.priceNote)}</p><a class="btn" href="${formURL(p.n.ko)}">${esc(x.ask)} ${ARR}</a></div>`)}
function showGuide(k){const g=GD[k];if(!g)return;const [ti,su,items]=g[L];const x=t();
 let body;if(g.check){const st=JSON.parse(LS.get("dh-check")||"{}");body=`<ul class="chk">${items.map((it,i)=>`<li><label><input type="checkbox" data-ck="${i}" ${st[i]?"checked":""}><span>${esc(it)}</span></label></li>`).join("")}</ul><p class="small">✓ ${esc(x.saved)}</p>`}
 else if(Array.isArray(items[0]))body=`<ol>${items.map(([a,b])=>`<li><b>${esc(a)}</b><br><span class="small" style="font-size:13px">${esc(b)}</span></li>`).join("")}</ol>`;
 else body=`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
 openModal(`<div class="ph">${img(g.img,ti,1)}</div><div class="mtx"><h3>${esc(ti)}</h3><p>${esc(su)}</p>${body}<a class="btn" href="${formURL()}">${esc(x.consult)} ${ARR}</a></div>`)}
/* ---------- render ---------- */
const main=document.getElementById("main");
function route(){const h=location.hash||"#/";const x=t();let view="home";
 if(h.startsWith("#/programs")||h.startsWith("#/p/"))view="programs";else if(h.startsWith("#/guides")||h.startsWith("#/g/"))view="guides";
 document.documentElement.lang=L;
 document.getElementById("nav").innerHTML=[["#/programs",0,"programs"],["#/guides",1,"guides"],["#/#clinics",2,"clinics"],[formURL(),3,""]].map(([u,i,v])=>`<a href="${u}" class="${view===v?"on":""}">${esc(x.nav[i])}</a>`).join("");
 document.getElementById("fl").innerHTML=`<a href="#/guides">${esc(x.ft[0])}</a><a href="index.html?form=1&l=${L}#privacy">${esc(x.ft[1])}</a><a href="${formURL()}">${esc(x.ft[2])}</a>`;
 document.getElementById("disc").textContent=x.disc+"  © 2026 청담도화 · LA BELLE LB";
 const m=document.getElementById("mcta");m.href=formURL();m.innerHTML=esc(x.start)+" "+ARR;
 main.innerHTML=view==="programs"?programs():view==="guides"?guides():home();
 const pm=/^#\/p\/(\w+)/.exec(h),gm=/^#\/g\/(\w+)/.exec(h);if(pm)showPk(pm[1]);else if(gm)showGuide(gm[1]);else if(!mdl.hidden)closeModal();
 if(h==="#/#clinics"){const c=document.getElementById("clinics");if(c)c.scrollIntoView()}
 bind()}
function bind(){
 const f=document.getElementById("srch");if(f)f.onsubmit=e=>{e.preventDefault();F={tab:"all",feat:null,q:document.getElementById("q").value};go("#/programs")};
 const q=document.getElementById("q");if(q)q.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();f.onsubmit(e)}};
}
function go(h){if(location.hash===h)route();else location.hash=h;scrollTo(0,0)}
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-cat]");if(c){const k=c.dataset.cat;F={tab:["skin","wellness"].includes(k)?k:"all",feat:["skin","wellness"].includes(k)?null:k,q:""};go("#/programs");return}
 const th=e.target.closest("[data-theme]");if(th){const g=th.dataset.theme;if(g[0]==="@"){location.hash="#/g/"+g.slice(1);return}F={tab:g,feat:null,q:""};go("#/programs");return}
 const tb=e.target.closest("[data-tab]");if(tb){F.tab=tb.dataset.tab;route();return}
 if(e.target.closest("[data-clr]")){F={tab:F.tab,feat:null,q:""};route();return}
 const pk=e.target.closest("[data-pk]");if(pk){location.hash="#/p/"+pk.dataset.pk;return}
 const gd=e.target.closest("[data-guide]");if(gd){location.hash="#/g/"+gd.dataset.guide;return}
 if(e.target.closest("[data-x]")||e.target===mdl){closeModal();return}
});
document.addEventListener("change",e=>{const c=e.target.closest("[data-ck]");if(!c)return;const st=JSON.parse(LS.get("dh-check")||"{}");st[c.dataset.ck]=c.checked;LS.set("dh-check",JSON.stringify(st))});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const sel=document.getElementById("lang");sel.value=L;sel.onchange=()=>{L=sel.value;LS.set("dh-lang",L);const h=location.hash;closeModal();route();if(/^#\/(p|g)\//.test(h))location.hash=h};
addEventListener("hashchange",()=>{route();if(!/^#\/(p|g)\//.test(location.hash)&&location.hash!=="#/#clinics")scrollTo(0,0)});
route();
</script>
