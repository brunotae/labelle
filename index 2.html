function tmsgsHTML(arr,t){
  let out="",lastDay="";
  arr.forEach(m=>{const d=dLocal(m.created_at);if(d!==lastDay){out+=`<div class="chday"><span>${d===today()?"오늘":fFull(d)}</span></div>`;lastDay=d}
    if(m.sender==="system"){out+=`<div class="cmsg sys"><div class="bub">${esc(m.body)}</div></div>`;return}
    const cust=m.sender==="customer";
    const who=cust?tName(t):m.sender==="bot"?"SOFIA 챗봇":(m.staff_name||"직원");
    const tr=cust?`<a class="trl" target="_blank" rel="noopener" href="https://translate.google.com/?sl=auto&tl=${UIL==="zh"?"zh-CN":UIL}&op=translate&text=${encodeURIComponent(m.body||"")}">번역</a>`:"";
    out+=`<div class="cmsg ${cust?"":"me"} ${m.sender==="bot"?"bot":""}"><div class="avs">${cust?`<span class="rav sm" style="width:30px;height:30px;font-size:15px">${FLAG[t.lang]||"🌐"}</span>`:m.sender==="bot"?`<img src="${portrait("sofia","여성")}" alt="">`:""}</div><div class="col"><span class="who"><span ${cust||m.sender==="staff"?"data-notr":""}>${esc(who)}</span>${m.faq_id&&m.faq_id!=="none"&&cust?` · ${esc(m.faq_id)}`:""}${m.faq_id==="none"&&cust?" · 답변 없음":""}${tr}</span><div class="bub" data-notr>${linkify(m.body||"")}</div></div><time>${tLocal(m.created_at)}</time></div>`});
  return out;
}

  const arr=CH.tmsgs[t.id];const lead=t.lead_id&&(S.leads||[]).find(l=>l.id===t.lead_id);
  const fq=CH.faq.filter(f=>f.a&&f.a[t.lang||"ko"]);
  return `<div class="chhead"><button class="chback" data-s3="back" aria-label="뒤로">‹</button><span class="rav sm" style="font-size:18px">${FLAG[t.lang]||"🌐"}</span><div class="t"><b data-notr>${esc(tName(t))}</b><small><span class="lgc">${LANGNM[t.lang]||"—"}</span> ${esc(TST[t.status]||"")}${t.coordinator?" · 링크: "+esc(t.coordinator):""}</small></div>
    <div class="tact">${t.status!=="closed"&&t.assigned!==meName()?`<button class="btn sm pri" data-s3="take">내가 담당</button>`:""}${t.status!=="closed"?`<button class="btn sm ghost" data-s3="close">종료</button>`:`<button class="btn sm ghost" data-s3="reopen">다시 열기</button>`}</div></div>
   ${t.emergency?`<div class="notice" style="margin:10px 12px 0;background:var(--rose2);color:var(--rose)">⚠ 고객이 응급 증상을 언급했습니다. 즉시 연락해 상태를 확인하세요.</div>`:""}
   <div class="tinfo">${t.nationality?`<span>국적 <b>${esc(t.nationality)}</b></span>`:""}${t.messenger||t.messenger_id?`<span>메신저 <b data-notr>${esc([t.messenger,t.messenger_id].filter(Boolean).join(" "))}</b></span>`:""}${t.phone?`<span>전화 <b data-notr>${esc(t.phone)}</b></span>`:""}${t.assigned?`<span>담당 <b data-notr>${esc(t.assigned)}</b></span>`:""}${lead?`<span><a href="#" data-go="leads">상담 관리에서 보기 ›</a></span>`:t.lead_id?`<span>상담 신청 접수됨</span>`:`<span class="dim">아직 연락처를 남기지 않았습니다</span>`}</div>
   <div class="chmsgs" id="thMsgs">${arr?tmsgsHTML(arr,t):`<div class="chempty"><span class="small">불러오는 중…</span></div>`}</div>
   ${t.status==="closed"?`<div class="chcomp" style="justify-content:center"><span class="small dim">종료된 대화입니다.</span></div>`:
   `<div class="chcomp"><select class="faqsel" id="thFaq" title="FAQ 답변 넣기"><option value="">FAQ 답변 넣기</option>${fq.map(f=>`<option value="${esc(f.id)}" data-notr>${esc(f.id.replace("FAQ-",""))} ${esc(fL(f.q).slice(0,30))}</option>`).join("")}</select><textarea id="thIn" rows="1" placeholder="${esc(trText("고객에게 답장 · Enter 전송"))}">${esc(CH.tdraft[t.id]||"")}</textarea><button class="ib send" id="thSend" aria-label="전송">${svgI("send")}</button></div>`}`;

function msgPageHTML(){
  if(CH.ok===false)return pageHead("고객 메시지","")+`<div class="notice">고객 메시지와 챗봇을 켜려면 Supabase SQL Editor에서 labelle_v22.sql을 한 번 실행해 주세요.</div>`;
  return `<div class="chwrap ${CH.thread?"has":""}" id="thWrap"><div class="chpane chside" id="thSide">${msgListHTML()}</div><div class="chpane chmain" id="thMain">${threadHTML()}</div></div>`;
}
function paintMsg(){
  const side=$("#thSide"),main=$("#thMain");if(!side||!main){if(S.tab==="msg")render();return}
  const L=$("#thList");const st=L?L.scrollTop:0;side.innerHTML=msgListHTML();const L2=$("#thList");if(L2)L2.scrollTop=st;
  const box=$("#thMsgs");const atBottom=!box||box.scrollHeight-box.scrollTop-box.clientHeight<80;
  const t=CH.threads.find(x=>x.id===CH.thread);
  if(box&&t&&CH.tmsgs[t.id]){box.innerHTML=tmsgsHTML(CH.tmsgs[t.id],t);if(atBottom)scrollBottom("#thMsgs")}
  else{const ta=$("#thIn");const keep=ta?ta.value:null;main.innerHTML=threadHTML();if(keep!==null&&$("#thIn"))$("#thIn").value=keep;scrollBottom("#thMsgs")}
  $("#thWrap")?.classList.toggle("has",!!CH.thread);bindMsg();
}
async function loadThreadMsgs(id,quiet){
  const {data,error}=await sb.from("labelle_thread_msgs").select("*").eq("thread_id",id).order("id",{ascending:true}).limit(500);
  if(error){if(!quiet)toast(v22Err(error));CH.tmsgs[id]=CH.tmsgs[id]||[];return}
  CH.tmsgs[id]=data||[];
}
async function seenThread(t){if(!t||!t.staff_unread)return;t.staff_unread=0;renderSide();setTitleBadge();try{await sb.from("labelle_threads").update({staff_unread:0}).eq("id",t.id)}catch(e){}}
async function openThread(id){
  CH.thread=id;if(S.tab!=="msg"){S.openId=null;S.tab="msg";render()}else paintMsg();
  await loadThreadMsgs(id);const main=$("#thMain");if(main&&CH.thread===id){main.innerHTML=threadHTML();bindMsg();scrollBottom("#thMsgs")}
  seenThread(CH.threads.find(x=>x.id===id));
}
async function tUpdate(t,p,msg){
  const {error}=await sb.from("labelle_threads").update(p).eq("id",t.id);if(error){toast(v22Err(error));return false}
  Object.assign(t,p);if(msg)await sb.from("labelle_thread_msgs").insert({thread_id:t.id,sender:"system",body:msg});
  await loadThreadMsgs(t.id,true);paintMsg();return true;
}
async function sendTMsg(){
  const ta=$("#thIn"),t=CH.threads.find(x=>x.id===CH.thread);if(!ta||!t)return;const body=ta.value.trim();if(!body||CH.sending)return;
  CH.sending=true;
  const {data,error}=await sb.from("labelle_thread_msgs").insert({thread_id:t.id,sender:"staff",staff_name:meName(),body}).select().single();
  CH.sending=false;if(error){toast(v22Err(error));return}
  ta.value="";ta.style.height="";CH.tdraft[t.id]="";
  if(!t.assigned||t.status!=="open"){const p={status:"open"};if(!t.assigned)p.assigned=meName();Object.assign(t,p);sb.from("labelle_threads").update(p).eq("id",t.id).then(()=>{})}
  t.staff_unread=0;const arr=CH.tmsgs[t.id]||(CH.tmsgs[t.id]=[]);if(!arr.some(x=>x.id===data.id))arr.push(data);paintMsg();scrollBottom("#thMsgs");$("#thIn")?.focus();
}
function bindMsg(){
  const w=$("#thWrap");if(!w)return;
  w.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>openThread(b.dataset.th));
  w.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{CH.tf=b.dataset.tf;paintMsg()});
  w.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();goTab(b.dataset.go)});
  w.querySelectorAll("[data-s3]").forEach(b=>b.onclick=async()=>{const k=b.dataset.s3,t=CH.threads.find(x=>x.id===CH.thread);
    if(k==="back"){CH.thread=null;paintMsg();$("#thMain").innerHTML=threadHTML();return}
    if(!t)return;
    if(k==="take")await tUpdate(t,{assigned:meName(),status:"open"},"담당자 지정: "+meName());
    else if(k==="close")await tUpdate(t,{status:"closed"},"상담 종료");
    else if(k==="reopen")await tUpdate(t,{status:"open"},null)});
  const sel=$("#thFaq");if(sel)sel.onchange=()=>{const t=CH.threads.find(x=>x.id===CH.thread),f=CH.faq.find(x=>x.id===sel.value);sel.value="";if(!f||!t)return;
    const ta=$("#thIn");const txt=(f.a[t.lang]||f.a.ko||"");ta.value=(ta.value?ta.value+"\n":"")+txt;CH.tdraft[t.id]=ta.value;ta.focus()};
  const ta=$("#thIn");if(ta){ta.oninput=()=>{CH.tdraft[CH.thread]=ta.value;ta.style.height="";ta.style.height=Math.min(140,ta.scrollHeight)+"px"};ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendTMsg()}}}
  const sd=$("#thSend");if(sd)sd.onclick=sendTMsg;
}

const BSTOP=new Set("what how can i by at from this that the is a an do does to of for my you your are be it in on with and or me we us there any about need get have will should when which o os as de do da dos das que como posso é e em um uma para por meu minha com no na se tem ter qual quais quando eu juu юу вэ уу үү болох би миний ямар хэрхэн хэзээ байна бол вэ?".split(" "));
const BSTOPG=new Set(["가능","능한","한가","있나","나요","하나","까요","을까","는지","어떻","떻게","인가","가요","되나","할수","수있","있을","해요","어요","받을","을수","있어","나요?","可以","以吗","什么","怎么","么办","请问","吗？"]);
function bgrams(s){
  s=String(s||"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ");const out=new Set();
  s.split(/\s+/).filter(Boolean).forEach(w=>{
    if(/[ㄱ-ㆎ가-힣一-鿿]/.test(w)){const cs=[...w];if(cs.length===1){if(/[一-鿿]/.test(w))out.add(w);return}
      for(let i=0;i<cs.length-1;i++){const g=cs[i]+cs[i+1];if(!BSTOPG.has(g))out.add(g)}}
    else{if(w.length<2||BSTOP.has(w))return;out.add(w.length>5?w.slice(0,5):w)}});
  return out;
}
let BIDX=null;
function bIndex(){
  BIDX=BOT.faq.map(f=>{const langs=[...new Set([BOT.lang,"ko","en"])];
    return {f,L:langs.map(l=>({Q:bgrams(f.q?.[l]),K:bgrams(f.kw?.[l]),A:bgrams(f.a?.[l])}))}});
}
function bMatch(text){
  if(!BIDX)bIndex();const qg=bgrams(text);if(!qg.size)return [];
  const res=BIDX.map(({f,L})=>{let best=0;L.forEach(x=>{let s=0;qg.forEach(g=>{s+=x.K.has(g)?1:x.Q.has(g)?.9:x.A.has(g)?.35:0});s/=qg.size;if(s>best)best=s});return {f,s:best}});
  return res.filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
}

/* ---------- settlements (재무·정산) ---------- */
const STL_ST={draft:"초안",confirmed:"확정",paid:"지급 완료"};
function stlCompute(a,m){
  const pct=Number(a.commission_pct)||0;
  const items=agPatients(a).filter(r=>r.status!=="canceled"&&(r.surgery_date||"").startsWith(m)).sort((x,y)=>(x.surgery_date||"").localeCompare(y.surgery_date||""))
    .map(r=>({patient_id:r.id,code:code(r),name:r.name,surgery_date:r.surgery_date,procedure:[r.hospital,r.procedure].filter(Boolean).join(" · "),base:r.paid_krw||0,commission:Math.round((r.paid_krw||0)*pct/100)}));
  const subtotal=items.reduce((s,i)=>s+i.commission,0);
  return {pct,items,subtotal};
}
function stlOf(a,m){return S.settles.find(s=>s.agency_code===a.code&&s.period===m)}
function stlView(a,m){
  const saved=stlOf(a,m);const live=stlCompute(a,m);
  const useSaved=saved&&saved.status!=="draft";
  const d=useSaved?{pct:saved.pct,items:saved.items||[],subtotal:saved.subtotal||0}:live;
  const adjust=S.stDraft?.adjust??(saved?.adjust||0),note=S.stDraft?.note??(saved?.note||"");
  return {saved,d,adjust,note,total:d.subtotal+(Number(adjust)||0),locked:useSaved};
}

    const k=b.dataset.stl,a=agencyList().find(x=>x.code===S.stl);if(!a)return;

    if(k==="print"){stlPrint(a,per);return}

    if(k==="del"){if(!S.armStl){S.armStl=true;render();setTimeout(()=>{if(S.armStl){S.armStl=false;if(S.tab==="finance")render()}},4000);return}
      const {error}=await sb.from("labelle_settlements").delete().eq("id",v.saved.id);if(error){toast(v23Err(error));return}S.settles=S.settles.filter(s=>s.id!==v.saved.id);S.armStl=false;S.stDraft=null;toast("삭제되었습니다.");render();return}
    let row;
    if(k==="save"||k==="confirm"){row={agency_id:a.id,agency:a.name,agency_code:a.code,period:per,pct:v.d.pct,items:v.d.items,subtotal:v.d.subtotal,adjust:Number(v.adjust)||0,total:v.total,note:v.note||null,status:k==="confirm"?"confirmed":"draft",updated_at:now,...(k==="confirm"?{confirmed_at:now}:{})}}
    else if(k==="paid")row={...v.saved,status:"paid",paid_at:now,updated_at:now};
    else if(k==="reopen")row={...v.saved,status:"draft",confirmed_at:null,updated_at:now};
    if(v.saved)row.id=v.saved.id;
    const {data,error}=await sb.from("labelle_settlements").upsert(row,{onConflict:"agency_code,period"}).select().single();
    if(error){toast(v23Err(error));return}
    const saved=data||row;const i=S.settles.findIndex(s=>s.agency_code===a.code&&s.period===per);if(i>=0)S.settles[i]={...S.settles[i],...saved};else S.settles.push(saved);

  });
}

async function sofiaCall(action,payload){
  let res;try{res=await sb.functions.invoke("sofia",{body:{action,...(payload||{})}})}catch(e){return {error:"network"}}
  if(res.error){let code="";try{const j=await res.error.context?.json?.();code=j?.error||""}catch(e){}
    if(!code){const m=String(res.error.message||"");code=/not found|404/i.test(m)?"missing":/Failed to send|fetch/i.test(m)?"network":"error"}

}

async function bSend(){
  const ta=$("#bpIn");const text=ta.value.trim();if(!text||BOT.busy)return;ta.value="";ta.style.height="";
  if(BOT.status==="closed"){BOT.token=null;BOT.after=0;BOT.status="bot";try{localStorage.removeItem("lb-bot-token")}catch(e){}}
  const em=EMRE.test(text);const ms=bMatch(text);const best=ms[0];
  const hit=!em&&best&&best.s>=.3?best.f:null;
  BOT.items.push({k:"me",text});

    else{

      const ai=await bAI(text);

      if(ai&&ai.answer&&ai.answer.trim()){
        const ids=(ai.faq_ids||[]).filter(id=>BOT.faq.some(f=>f.id===id));
        BOT.items.push({k:"ai",text:ai.answer,handoff:!!ai.handoff,rel:[...new Set([...ids,...rel])].slice(0,3)});bPaint(true);

}

  g.innerHTML=`<div class="gcard"><div class="glogo">LA BELLE <span>LB</span></div>${inner}</div>`;g.hidden=false;$("#auth").hidden=true;$("#app").hidden=true;return g}
function gateClose(){const g=$("#gate");if(g)g.hidden=true}
const pwOk=p=>p.length>=10&&/[A-Za-z]/.test(p)&&/\d/.test(p);
function setPwHTML(){return `<h2>비밀번호 설정</h2><p class="small muted">${AUTH_LINK==="recovery"?"새 비밀번호를 입력하세요.":"LA BELLE LB 계정이 만들어졌습니다. 사용할 비밀번호를 정하세요."}</p>
  <div class="f"><label class="lb">새 비밀번호</label><input id="gPw1" class="in" type="password" autocomplete="new-password"></div>
  <div class="f"><label class="lb">비밀번호 확인</label><input id="gPw2" class="in" type="password" autocomplete="new-password"></div>
  <p class="small dim">10자 이상, 영문과 숫자를 함께 사용하세요. 관리자도 비밀번호를 볼 수 없습니다.</p>
  <div id="gMsg" class="gmsg"></div><button class="btn pri" id="gSave" style="width:100%">저장</button>`}
async function gateSetPw(){
  return new Promise(res=>{const g=gateBox(setPwHTML());
    $("#gSave").onclick=async()=>{const a=$("#gPw1").value,b=$("#gPw2").value;
      if(!pwOk(a)){$("#gMsg").textContent="10자 이상, 영문과 숫자를 함께 사용하세요.";return}
      if(a!==b){$("#gMsg").textContent="두 비밀번호가 다릅니다.";return}
      $("#gMsg").textContent="저장 중…";const {error}=await sb.auth.updateUser({password:a});
      if(error){$("#gMsg").textContent="저장 실패: "+error.message;return}
      history.replaceState(null,"",location.pathname+location.search);toast("비밀번호를 저장했습니다.");res(true)}})
}
async function gateMfa(w){
  const lf=await sb.auth.mfa.listFactors();
  if(lf.error){toast("MFA 확인 실패: "+lf.error.message);return false}
  const ver=(lf.data?.totp||[]).find(f=>f.status==="verified");
  let factorId=ver?.id,qr="",secret="";
  if(!ver){
    for(const f of (lf.data?.all||[]).filter(f=>f.status!=="verified"))await sb.auth.mfa.unenroll({factorId:f.id});
    const en=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"LA BELLE LB "+new Date().toISOString().slice(0,16)});
    if(en.error){gateBox(`<h2>2단계 인증 (MFA)</h2><p class="gmsg">MFA를 시작할 수 없습니다: ${esc(en.error.message)}</p><p class="small dim">Supabase → Authentication → MFA에서 TOTP(인증 앱)를 켜야 합니다.</p><button class="btn" id="gOut">로그아웃</button>`);$("#gOut").onclick=gateOut;return false}
    factorId=en.data.id;qr=en.data.totp?.qr_code||"";secret=en.data.totp?.secret||"";
  }
  return new Promise(res=>{
    gateBox(`<h2>2단계 인증 (MFA)</h2>
     <p class="small muted">이 계정은 인증 앱(2단계 인증)이 필요합니다.</p>${ver?`<p class="small muted">인증 앱에 표시된 6자리 숫자를 입력하세요.</p>`:""}
     ${ver?"":`<ol class="gsteps"><li>휴대폰에 Google Authenticator 또는 Microsoft Authenticator를 설치합니다.</li><li>앱에서 + 를 누르고 아래 QR 코드를 스캔합니다.</li><li>앱에 표시된 6자리 숫자를 입력합니다.</li></ol>
       ${qr?`<div class="gqr"><img src="${qr.startsWith("data:")?qr:"data:image/svg+xml;utf8,"+encodeURIComponent(qr)}" alt="QR"></div>`:""}
       ${secret?`<p class="small dim" style="text-align:center">QR을 스캔할 수 없으면 직접 입력: <code data-notr>${esc(secret)}</code></p>`:""}`}
     <div class="f"><input id="gCode" class="in gcode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" data-notr></div>
     <div id="gMsg" class="gmsg"></div>
     <div class="brow"><button class="btn ghost" id="gOut">로그아웃</button><button class="btn pri" id="gOk" style="flex:1">확인</button></div>
     <p class="small dim" style="margin-top:12px">휴대폰을 바꾸거나 잃어버린 경우 최고관리자에게 ‘MFA 초기화’를 요청한 뒤 다시 로그인하면 새로 등록할 수 있습니다.</p>`);
    const go=async()=>{const code=$("#gCode").value.replace(/\D/g,"");if(code.length!==6){$("#gMsg").textContent="6자리 숫자를 입력하세요.";return}
      $("#gMsg").textContent="확인 중…";const v=await sb.auth.mfa.challengeAndVerify({factorId,code});
      if(v.error){$("#gMsg").textContent="코드가 맞지 않습니다. 앱의 새 숫자로 다시 입력하세요.";$("#gCode").value="";return}
      toast(ver?"인증되었습니다.":"MFA 등록이 완료되었습니다.");res(true)};
    $("#gOk").onclick=go;$("#gCode").onkeydown=e=>{if(e.key==="Enter")go()};$("#gOut").onclick=gateOut;setTimeout(()=>$("#gCode")?.focus(),50)});
}
async function gateOut(){await sb.auth.signOut();gateClose();location.replace(location.pathname)}
async function authGate(){
  if(AUTH_LINK&&!authGate._pw){authGate._pw=true;await gateSetPw()}
  let w=null;try{const r=await sb.rpc("labelle_whoami");if(!r.error)w=r.data}catch(e){}
  if(!w)return true;  /* labelle_v25.sql 아직 안 함 → 기존 방식 */
  S.who=w;
  if(w.mfa_required&&w.aal!=="aal2"){const ok=await gateMfa(w);if(!ok)return false;try{const r=await sb.rpc("labelle_whoami");if(!r.error)S.who=r.data}catch(e){}}
  gateClose();return true;
}
const _showAppS6=showApp;
showApp=async function(){if(!(await authGate()))return;return _showAppS6()};

/* ---------- 데이터 로딩: 뷰 사용 ---------- */
async function load(){
  const {data,error}=await selPatients();
  if(error){S.loadErr=error.message;toast("불러오기 실패: "+error.message);return}
  S.loadErr=null;
  S.rows=(data||[]).map(r=>({...r,events:r.events||[],log:r.log||[],files:r.files||[]}));
  const ag=await sb.from("labelle_agencies").select("*").order("name",{ascending:true});
  S.agencies=ag.error?[]:(ag.data||[]);
  await loadExtra();
}

async function loadAdm(){
  const r=await sb.rpc("labelle_admin_staff");

  S.adm=r.data||[];
  const f=await sb.from("labelle_login_log").select("*").eq("ok",false).order("id",{ascending:false}).limit(15);
  S.admFail=f.error?[]:(f.data||[]);render();
}

async function admUpdate(email,p,msg){
  const {error}=await sb.from("labelle_staff").update(p).eq("email",email);
  if(error){toast(/최고관리자/.test(error.message)?error.message:"저장 실패: "+error.message);await loadAdm();return false}
  const x=(S.adm||[]).find(s=>s.email===email);if(x)Object.assign(x,p);const y=(S.staff||[]).find(s=>s.email===email);if(y)Object.assign(y,p);
  if(msg)toast(msg);return true;
}

function bindMed(r){

 ko:{home:"홈으로",saved:"작성 내용이 이 기기에 자동 저장됩니다.",resumed:"이전에 작성하던 내용을 불러왔습니다.",reset:"처음부터 다시 작성"},

function formHome(){let staff=false;try{staff=!!localStorage.getItem("labelle-auth")}catch(e){}return staff?baseURL():SITE_HOME}
const DRAFT_KEY=()=>"labelle_form_draft_"+(IN.slug||"form");
const DRAFT_DAYS=30;
const DF_IDS=["iName","iBirth","iPhone","iMsgr","iMsgrId","iEmail","iProc","iVisit","iMsg"];
function draftRead(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY())||"null");if(!d)return null;
  if(Date.now()-(d.at||0)>DRAFT_DAYS*864e5){localStorage.removeItem(DRAFT_KEY());return null}return d}catch(e){return null}}
function draftClear(){try{localStorage.removeItem(DRAFT_KEY())}catch(e){}}
function draftCollect(box){const d={at:Date.now(),lang:IN.lang,v:{},chips:{},cons:{}};
  DF_IDS.forEach(id=>{const el=box.querySelector("#"+id);if(el)d.v[id]=el.value});
  const g=box.querySelector("#iGender");if(g)d.gender=g.selectedIndex;
  box.querySelectorAll(".chips[data-field]").forEach(c=>d.chips[c.dataset.field]=c.querySelector(".chip.on")?.dataset.v||null);
  box.querySelectorAll("[data-cons]").forEach(c=>d.cons[c.dataset.cons]=c.checked);
  return d}
const draftHasContent=d=>!!d&&(Object.values(d.v||{}).some(x=>x&&String(x).trim())||d.gender>0||!!(d.chips||{}).idept||Object.values(d.cons||{}).some(Boolean));
function draftSave(box){if(IN.done||!box.querySelector("#iSend"))return;const d=draftCollect(box);
  try{draftHasContent(d)?localStorage.setItem(DRAFT_KEY(),JSON.stringify(d)):localStorage.removeItem(DRAFT_KEY())}catch(e){}}
function draftApply(box,d){
  DF_IDS.forEach(id=>{const el=box.querySelector("#"+id);if(el&&d.v&&d.v[id]!=null)el.value=d.v[id]});
  const g=box.querySelector("#iGender");if(g&&d.gender>=0&&d.gender<g.options.length)g.selectedIndex=d.gender;
  Object.entries(d.chips||{}).forEach(([f,v])=>{const c=box.querySelector(`.chips[data-field="${f}"]`);if(!c)return;
    c.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",!!v&&x.dataset.v===v))});
  box.querySelectorAll("[data-cons]").forEach(c=>c.checked=!!(d.cons||{})[c.dataset.cons]);
  const all=box.querySelector("#cAll");if(all)all.checked=[...box.querySelectorAll("[data-cons]")].every(x=>x.checked)}

  const hd=box.querySelector("h1.title")?.parentElement;
  if(hd){hd.classList.add("fxlogo");hd.setAttribute("role","link");hd.tabIndex=0;hd.title=fx("home");
    const go=()=>{draftSave(box);location.href=home};hd.onclick=go;hd.onkeydown=e=>{if(e.key==="Enter")go()}}

  const card=box.querySelector("#iSend")?.closest(".card");
  if(card){const sub=card.querySelector("p.muted");
    const note=IN.resumed==="show"

    (sub||card.firstElementChild).insertAdjacentHTML("afterend",note)}
  const rs=$("#fxReset");if(rs)rs.onclick=()=>{draftClear();IN.resumed=true;renderIntake()};
  /* 입력할 때마다 저장 */
  let tm=null;const later=()=>{clearTimeout(tm);tm=setTimeout(()=>draftSave(box),250)};

  /* 언어 변경 직전에 저장 (다시 그려도 내용 유지) */
  box.querySelectorAll("[data-il]").forEach(b=>{const f=b.onclick;b.onclick=()=>{draftSave(box);f&&f()}});
};

let I18N_RE=null;
function trText(t){
  if(UIL==="ko"||!t||!/[가-힣]/.test(t))return t;
  const ex=I18N_EXACT[UIL][t.trim()];if(ex)return t.replace(t.trim(),ex);
  const li={en:1,zh:2,mn:3,pt:4}[UIL]||1;for(const p of I18N_PAT)t=t.replace(p[0],p[li]);
  if(!I18N_RE){const keys=Object.keys(I18N.en).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));I18N_RE=new RegExp(keys.join("|"),"g")}
  return t.replace(I18N_RE,m=>I18N[UIL][m]??m);
}
function trNode(root){
  if(UIL==="ko"||!root)return;
  const skip=n=>{const e=n.nodeType===1?n:n.parentElement;return !e||e.closest("#intake,#botpub,textarea,[data-notr],script,style")};
  if(root.nodeType===3){if(!skip(root)){const v=trText(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}return}
  if(root.nodeType!==1||skip(root))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const list=[];while((n=w.nextNode()))list.push(n);
  list.forEach(n=>{if(skip(n))return;const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  [root,...root.querySelectorAll("[placeholder],[title],[aria-label]")].forEach(e=>{if(!e.getAttribute||skip(e))return;["placeholder","title","aria-label"].forEach(a=>{const v=e.getAttribute(a);if(v&&/[가-힣]/.test(v))e.setAttribute(a,trText(v))})});
}
const I18N_OBS=new MutationObserver(ms=>{I18N_OBS.disconnect();ms.forEach(m=>{if(m.type==="characterData")trNode(m.target);else m.addedNodes.forEach(trNode)});obsOn()});
function obsOn(){if(UIL!=="ko")I18N_OBS.observe(document.body,{childList:true,subtree:true,characterData:true})}
document.querySelectorAll("[data-uil]").forEach(b=>{b.classList.toggle("on",b.dataset.uil===UIL);b.onclick=()=>{try{localStorage.setItem("lb-lang",b.dataset.uil)}catch(e){}location.reload()}});
document.querySelectorAll(".uilsel").forEach(x=>{x.value=UIL;x.onchange=()=>{try{localStorage.setItem("lb-lang",x.value)}catch(e){}location.reload()}});
if(UIL!=="ko"){document.documentElement.lang={zh:"zh-CN",mn:"mn",pt:"pt-BR",en:"en"}[UIL]||"en";trNode(document.body);obsOn()}
