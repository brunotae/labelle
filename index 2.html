<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA BELLE LB</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LA BELLE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-v3.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#09060A; --s1:#140D16; --s2:#1E1421; --s3:#2A1C2D; --line:#3A2433;
  --text:#FFF4F9; --muted:#C3A9B9; --dim:#8E7486;
  --pink:#FF2E8B; --pink2:#FF7CC0; --paper:#FFE6F1; --warm:#FFB37A;
  --grad:linear-gradient(100deg,#FF2E8B 0%,#FF5FA8 55%,#FF8CC6 100%);
  --ok:#5BE3A8; --warn:#FFC266;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text)}
body{font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}

/* glows */
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.glow i:nth-child(1){width:340px;height:340px;left:-120px;top:-110px;background:#FF2E8B;opacity:.35}
.glow i:nth-child(2){width:300px;height:300px;right:-120px;top:120px;background:#FFB37A;opacity:.22}
.glow i:nth-child(3){width:380px;height:380px;left:20%;bottom:-200px;background:#B5177A;opacity:.3}

.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:18px 16px 60px}

/* header */
.kicker{display:inline-block;position:relative;font-weight:700;font-size:13px;color:#fff;padding:3px 14px 4px;margin-bottom:6px}
.kicker::before{content:"";position:absolute;inset:0;background:var(--grad);transform:skew(-10deg) rotate(-1.5deg);
  border-radius:3px 10px 4px 12px;z-index:-1;box-shadow:0 0 22px rgba(255,46,139,.45)}
.title{font-weight:900;font-size:40px;letter-spacing:.02em;line-height:1;margin:2px 0 0}
.title .ol{color:transparent;-webkit-text-stroke:1.6px var(--pink2);margin-left:8px}
.script{font-family:'Dancing Script',cursive;color:var(--pink2);font-size:24px;line-height:1.1;transform:rotate(-3deg);display:inline-block}
.logo{display:block;color:inherit;text-decoration:none;cursor:pointer}
.logo:active{opacity:.75}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.next{margin-top:10px;font-size:13px;color:var(--muted)}
.next b{color:var(--text);font-weight:700}

/* tabs */
.tabs{display:flex;gap:8px;margin:18px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 22px rgba(255,46,139,.35)}

/* cards */
.card{background:rgba(30,20,33,.72);border:1px solid var(--line);border-radius:20px;padding:16px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.stack>*+*{margin-top:12px}
.h2{font-weight:900;font-size:18px;margin:0 0 10px}
.h3{font-weight:700;font-size:13px;color:var(--pink2);letter-spacing:.04em;margin:0 0 8px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{text-align:left;padding:14px;border-radius:18px;background:rgba(30,20,33,.72);border:1px solid var(--line);min-height:44px}
.stat .n{font-weight:900;font-size:30px;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset,0 8px 26px rgba(255,46,139,.25)}
.stat.on .n{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* patient cards */
.plist{display:grid;gap:10px;margin-top:14px}
@media(min-width:720px){.plist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc{text-align:left;width:100%;display:block}
.pc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc .nm{font-weight:900;font-size:18px}
.code{font-size:11px;color:var(--dim);letter-spacing:.05em}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,46,139,.16);color:var(--pink2);border:1px solid rgba(255,46,139,.35);white-space:nowrap}
.pill.gray{background:var(--s3);color:var(--muted);border-color:var(--line)}
.pill.ok{background:rgba(91,227,168,.12);color:var(--ok);border-color:rgba(91,227,168,.35)}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:9px;background:var(--s3);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.nx{font-size:13px;margin-top:10px}
.nx b{color:var(--pink2)}

.empty{text-align:center;padding:30px 16px}
.empty .pen{font-family:'Nanum Pen Script',cursive;font-size:30px;color:var(--pink2);line-height:1.15}

/* buttons */
.btn{white-space:nowrap;min-height:46px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--s3);border:1px solid var(--line)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(255,46,139,.32)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,80,110,.12);border-color:rgba(255,80,110,.45);color:#FF8FA6}
.btn.danger.arm{background:#E0244F;color:#fff;border-color:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.brow.end{justify-content:flex-end}

/* forms */
.f{margin-bottom:14px}
.f label.lb{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f label.lb em{color:var(--pink);font-style:normal}
.in{width:100%;min-height:46px;border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:10px 14px;outline:none}
.in:focus{border-color:var(--pink)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:44px;padding:0 15px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted)}
.chip.on{background:rgba(255,46,139,.18);border-color:var(--pink);color:#fff;font-weight:700}
.chips.small .chip{min-height:38px;padding:0 12px;font-size:13px}
.confirm{font-size:12.5px;color:var(--pink2);margin-top:5px;min-height:18px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:520px){.g3{grid-template-columns:minmax(0,1fr)}}
.warnbox{background:rgba(255,194,102,.1);border:1px solid rgba(255,194,102,.4);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);font-weight:700}
.dhead .nm{font-weight:900;font-size:28px;line-height:1.15}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{min-height:36px;padding:0 11px;border-radius:999px;font-size:12.5px;background:var(--s1);border:1px solid var(--line);color:var(--dim)}
.step.done{color:var(--muted);border-color:#5a3049}
.step.cur{background:var(--grad);color:#fff;border-color:transparent;font-weight:700}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:14px}
.kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-word}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 10px;background:var(--pink)}
.ev .body{flex:1;min-width:0;text-align:left}
.ev .t1{font-weight:700}
.ev .t2{font-size:13px;color:var(--muted)}
.ev.done .t1{text-decoration:line-through;color:var(--dim)}
.tick{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--dim);font-size:12px;font-weight:700}
.tick.on{background:rgba(91,227,168,.14);border-color:rgba(91,227,168,.5);color:var(--ok)}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sc{padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13px}
.sc b{display:block;font-size:12px;color:var(--pink2)}
.sc.past{opacity:.5}
.sc.today{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.log{font-size:12.5px;color:var(--muted);max-height:220px;overflow:auto}
.log div{padding:5px 0;border-top:1px dashed var(--line)}
.log div:first-child{border-top:0}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money .m{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px}
.money .m b{display:block;font-size:16px;font-weight:900}
.money .m span{font-size:12px;color:var(--dim)}
.dgrid{display:grid;gap:12px}
@media(min-width:820px){.dgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}}

/* calendar */
.calwrap{display:grid;gap:12px}
@media(min-width:820px){.calwrap{grid-template-columns:330px minmax(0,1fr);align-items:start}}
.cals{display:grid;gap:12px}
@media(max-width:819px){.cals{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:560px){.cals{grid-template-columns:minmax(0,1fr)}}
.mcal .mh{font-weight:900;margin-bottom:6px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:12.5px}
.mgrid .wd{color:var(--dim);font-size:11px;padding:2px 0}
.dcell{position:relative;min-height:36px;border-radius:10px;color:var(--muted)}
.dcell.has::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--pink)}
.dcell.today{color:#fff;font-weight:900;box-shadow:0 0 0 1px var(--line) inset}
.dcell.sel{background:var(--grad);color:#fff;font-weight:900}
.dcell.sel::after{background:#fff}

/* patient view */
.pv{position:fixed;inset:0;z-index:20;background:#0B070C;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pv .sky{position:absolute;left:0;right:0;top:0;height:300px;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,179,122,.32) 0%,rgba(255,46,139,.22) 45%,rgba(11,7,12,0) 100%)}
.pv .in2{position:relative;max-width:440px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
.pv .hello{font-weight:900;font-size:26px;line-height:1.2;margin-top:4px}
.pv .pen{font-family:'Nanum Pen Script',cursive;font-size:24px;color:var(--paper);line-height:1.15;margin-top:8px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--pink),rgba(255,46,139,.1))}
.tli{position:relative;padding:0 0 14px}
.tli::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--pink)}
.tli.done::before{background:var(--pink)}
.tli .d{font-size:12px;color:var(--pink2);font-weight:700}
.tli .w{font-weight:700}
.tli .p{font-size:13px;color:var(--muted)}
.chg{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:#E0244F;border-radius:999px;padding:1px 8px;vertical-align:2px}
.ring{display:flex;align-items:center;gap:14px}
.ring .pct{font-weight:900;font-size:34px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* auth */
.auth{max-width:400px;margin:8vh auto 0}
.auth .pen{font-family:'Nanum Pen Script',cursive;font-size:28px;color:var(--pink2);line-height:1.15;margin:16px 0 18px}

/* medical files */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.fc .th{display:block;width:100%;aspect-ratio:5/6;object-fit:cover;background:#1a1218}
.fc .th.doc{aspect-ratio:5/4}
.fc .fb{padding:9px 10px 10px;font-size:12.5px}
.fc .ft{font-weight:700;font-size:13.5px;line-height:1.3}
.fc .fr{display:flex;gap:6px;margin-top:8px}
.fc .fr .btn{flex:1;min-height:36px;padding:0 8px;font-size:12px}
.share{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--s3);color:var(--dim);display:inline-block;margin-top:5px}
.share.on{background:rgba(91,227,168,.12);color:var(--ok)}
.req{display:flex;flex-wrap:wrap;gap:6px}
.rq{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 6px 0 12px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--s1)}
.rq.ok{color:var(--ok);border-color:rgba(91,227,168,.4);padding-right:12px}
.rq.miss{color:var(--warn);border-color:rgba(255,194,102,.45)}
.rq button{min-height:28px;padding:0 10px;border-radius:999px;background:rgba(255,194,102,.16);color:var(--warn);font-size:11.5px;font-weight:700}
.cmp{position:relative;width:100%;max-width:420px;aspect-ratio:5/6;border-radius:18px;overflow:hidden;margin:6px auto 0;border:1px solid var(--line);touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.cmp .top{clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px rgba(255,46,139,.8);pointer-events:none}
.cmp .ln::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--grad);color:#fff;font-weight:900;font-size:14px;border-radius:999px;padding:6px 10px;white-space:nowrap}
.cmp .tg{position:absolute;top:10px;font-family:'Dancing Script',cursive;font-size:22px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.lbx{position:fixed;inset:0;z-index:30;background:#09060A;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px 30px}
.lbx .box{width:100%;max-width:520px}
.lbx img{width:100%;border-radius:18px;border:1px solid var(--line);display:block}
.demo-note{font-size:12px;color:var(--warn);background:rgba(255,194,102,.08);border:1px dashed rgba(255,194,102,.4);border-radius:12px;padding:8px 10px;margin-top:8px}
/* v1.6 */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--s3);border:2px solid rgba(255,46,139,.55);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--pink2);overflow:hidden}
.av.lg{width:72px;height:72px;font-size:24px}
.avwrap{position:relative;display:inline-block;cursor:pointer;flex:0 0 auto}
.avwrap .cam{position:absolute;right:-4px;bottom:-4px;background:var(--grad);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px;white-space:nowrap}
.pchead{display:flex;gap:12px;align-items:center;min-width:0}
.stp{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;margin-top:14px}
.sn{aspect-ratio:1/1;min-width:0;padding:0;border-radius:50%;font-size:11px;font-weight:700;background:var(--s1);border:1px solid var(--line);color:var(--dim);line-height:1}
.sn.done{background:rgba(255,46,139,.22);border-color:transparent;color:#FFD0E6}
.sn.cur{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 0 12px rgba(255,46,139,.55)}
.stpl{margin-top:8px;font-size:14px}
.stpl b{font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.codebox{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--s3);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.agnew{background:var(--s1);border:1px dashed var(--line);border-radius:14px;padding:10px;margin-top:8px}
.fileline{font-size:12.5px;color:var(--muted);margin-top:6px}
.fc .th.doc{object-fit:cover}
/* v1.7 */
.who{display:inline-flex;align-items:center;gap:5px;font-weight:700;cursor:pointer;white-space:nowrap}
.who i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
.who:hover{text-decoration:underline}
.lnk{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,124,192,.55)}
.sec .secb{display:none;margin-top:12px}.sec.open .secb{display:block}
.sech{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px;text-align:left;padding:0}
.pm{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:var(--pink2)}
.sec.open .pm{background:var(--grad);color:#fff}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--s3);color:var(--muted);font-size:11px;margin-left:4px;text-align:center}
.qs{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.qs b{color:var(--pink2);font-size:15px;margin-right:2px}
.qs.on{border-color:var(--pink);color:#fff}
.clock{min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.clock.on{background:rgba(91,227,168,.14);border-color:rgba(91,227,168,.5);color:var(--ok)}
.kp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px;text-align:center}
.kp4 b{display:block;font-size:17px;font-weight:900}.kp4 span{font-size:11px;color:var(--dim)}
.linkrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.linkrow code{font-size:11.5px;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 150px;min-width:0}
.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(min-width:720px){.stats.six{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stats.six .n{font-size:24px}
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pgrid .wd{text-align:center;font-size:11px;color:var(--dim)}
.pcell{min-height:58px;border-radius:10px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:4px 2px;gap:1px;min-width:0}
.pcell .dn{font-size:11px;color:var(--muted)}
.pcell b{font-size:17px;font-weight:900;color:#fff;line-height:1.1}
.pcell .hrs{font-size:10px;color:var(--muted)}
.pcell.today{box-shadow:0 0 0 1px var(--pink2) inset}
.pcell.sel{outline:2px solid #fff;outline-offset:-1px}
.chip.sw{width:40px;min-width:40px;padding:0;background:var(--c);border-color:transparent}
.chip.sw.on{outline:3px solid #fff;outline-offset:2px;background:var(--c)}
.consents{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;margin-top:8px}
.okc{color:var(--ok)}.noc{color:var(--dim)}
.consentbox{border:1px solid var(--line);border-radius:14px;padding:4px 12px;background:var(--s1)}
.cons{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.cons:first-child{border-top:0}
.cons label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.cons input{width:20px;height:20px;accent-color:#FF2E8B;flex:0 0 auto;margin-top:1px}
.cons details{margin:4px 0 0 28px;font-size:12px;color:var(--muted)}
.cons summary{cursor:pointer;color:var(--pink2)}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--s3);color:var(--muted);white-space:nowrap}
.tag.rq2{background:rgba(255,46,139,.18);color:var(--pink2)}
.intakewrap{max-width:560px;margin:0 auto}
.tab .bdg{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:#fff;color:#E0244F;font-size:11px;line-height:18px}
.langsw{display:inline-flex;gap:4px}
.langsw button{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--dim);border:1px solid var(--line);min-height:28px}
.langsw button.on{color:#fff;background:var(--s3);border-color:var(--pink)}
.tier{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:1px;background:rgba(255,255,255,.04)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  background:#fff;color:#1a0f17;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.4)}
.foot{margin-top:18px;font-size:12.5px;color:var(--dim)}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ===================== v3 · Korean heritage luxury ===================== */
:root{
  --bg:#F4EFE6; --s1:#FFFDF8; --s2:#FFFFFF; --s3:#EFE8DB; --line:#E4DBCB; --text:#2A2722; --muted:#6E675D; --dim:#9C9487;
  --pink:#2F5A43; --pink2:#A8874F; --paper:#FBF7EF; --warm:#C7A86E; --ok:#3C7A55; --warn:#B07A2A;
  --grad:linear-gradient(120deg,#244A36,#3E6B50);
  --forest:#244A36; --forest2:#3E6B50; --sage:#9DB09A; --sage2:#DCE5D8; --gold:#B8975F; --gold2:#E3D2AE; --ivory:#F7F2E9; --rose:#C4566A; --rose2:#F6E1E4; --sky:#E4ECF2;
  --serif:"Cormorant Garamond","Noto Serif KR","Noto Sans KR",Georgia,serif;
  --sans:"Noto Sans KR","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --shadow:0 10px 30px rgba(70,55,30,.07);
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:14.5px}
.glow{display:none}
.wrap{max-width:none;padding:0}
#app>header,#app>nav.tabs{display:none}
.card{background:var(--s2);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:18px}
.h2{font-weight:700;font-size:20px;color:var(--text)}
.h3{color:var(--gold);font-weight:700;letter-spacing:.06em}
.btn{background:var(--s2);border-color:var(--line);color:var(--text)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(36,74,54,.22)}
.btn.danger{background:var(--rose2);border-color:#E8B9C1;color:var(--rose)}
.btn.danger.arm{background:var(--rose);color:#fff}
.chip{background:var(--s1);color:var(--muted);border-color:var(--line)}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.in{background:var(--s1);border-color:var(--line);color:var(--text)}
.in:focus{border-color:var(--forest2);box-shadow:0 0 0 3px rgba(62,107,80,.12)}
.stat{background:var(--s2)}
.stat.on{border-color:var(--forest);box-shadow:0 0 0 1px var(--forest) inset}
.stat.on .n{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--forest)}
.pill{background:var(--sage2);color:var(--forest);border-color:transparent}
.pill.gray{background:var(--s3);color:var(--muted)}
.pill.ok{background:#E2EFE6;color:var(--ok)}
.bar{background:var(--s3)}
.bar i{background:linear-gradient(90deg,var(--forest),var(--sage))}
.tick.on{background:#E2EFE6;color:var(--ok);border-color:#BFD9C7}
.sc{background:var(--s1)}
.sc.today{border-color:var(--forest);box-shadow:0 0 0 1px var(--forest) inset}
.sn{background:var(--s1);color:var(--dim)}
.sn.done{background:var(--sage2);color:var(--forest)}
.sn.cur{background:var(--forest);color:#fff;box-shadow:0 0 0 4px rgba(36,74,54,.15)}
.stpl b{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--forest);font-family:var(--serif);font-size:26px}
.codebox{background:var(--ivory);color:var(--forest);border-color:var(--gold2)}
.dcell.sel,.pcell.sel{background:var(--forest);color:#fff}
.dcell.has::after{background:var(--gold)}
.pv{background:var(--ivory);color:var(--text)}
.pv .sky{background:linear-gradient(180deg,rgba(199,168,110,.25),rgba(244,239,230,0))}
.pv .pen{color:var(--gold);font-family:var(--serif);font-style:italic}
.pv .ring .pct{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--forest);font-family:var(--serif)}
.lbx{background:rgba(42,39,34,.88)}
.lbx .box{background:var(--s2);border-radius:20px;padding:16px}
.kicker{color:#fff}
.kicker::before{background:linear-gradient(120deg,var(--forest),var(--forest2));box-shadow:none}
.script{color:var(--gold);font-family:var(--serif);font-style:italic}
.warnbox{background:#FBF1DF;border-color:#EBD3A6;color:#8A5F1C}
.toast{background:var(--forest);color:#fff}
.tier{background:var(--s2)}
.who i{box-shadow:0 0 0 2px var(--s2)}
.clock{background:var(--s2);border-color:var(--line);color:var(--text)}
.clock.on{background:#E2EFE6;color:var(--ok);border-color:#BFD9C7}
.sec .pm{background:var(--ivory);color:var(--forest)}
.sec.open .pm{background:var(--forest);color:#fff}
.qs{background:var(--s2)}
.qs.on{border-color:var(--forest);color:var(--forest)}
.qs b{color:var(--gold)}
.chip.sw.on{outline-color:var(--text)}
.linkrow code{background:var(--ivory)}
.consentbox{background:var(--s1)}
.dot{background:var(--gold)}
.pc .nm,.dhead .nm{color:var(--text)}
.tab .bdg{background:var(--rose);color:#fff}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#FBF8F2 0%,#F3EDE2 70%,#EDE5D6 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 0}
.side::-webkit-scrollbar{width:0}
.brand{display:block;text-align:center;text-decoration:none;color:var(--text);padding:0 6px 16px}
.brand svg{width:42px;height:42px;stroke:var(--gold);fill:none;stroke-width:1.2}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:27px;letter-spacing:.06em;line-height:1.1;margin-top:4px}
.brand small{display:block;font-size:9.5px;letter-spacing:.36em;color:var(--gold);margin-top:3px}
.brand p{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.55}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:6px 12px;border-radius:12px;text-align:left;color:var(--text);margin-bottom:2px;position:relative}
.nav svg{width:20px;height:20px;flex:0 0 20px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav span{display:flex;flex-direction:column;line-height:1.25;font-size:14px;font-weight:500}
.nav small{font-size:10.5px;color:var(--dim);font-weight:400;letter-spacing:.02em}
.nav:hover{background:rgba(36,74,54,.06)}
.nav.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(36,74,54,.25)}
.nav.on small{color:rgba(255,255,255,.75)}
.nav .bdg,.nav .nb{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;border-radius:999px;background:var(--rose);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;margin:0}
.nav .soon{position:absolute;right:10px;font-size:9.5px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:0 6px}
.side-art{margin:18px -14px 0;flex:1 0 170px;min-height:170px;background:url(img/side.jpg) center bottom/cover no-repeat;position:relative;-webkit-mask:linear-gradient(180deg,transparent,#000 45%);mask:linear-gradient(180deg,transparent,#000 45%);opacity:.85}
.side-art span{position:absolute;left:18px;bottom:16px;font-size:9.5px;letter-spacing:.32em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);line-height:1.8}
html:not([lang="ko"]) .nav small{display:none}

.mainc{min-width:0;padding:18px 22px 40px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-bottom:16px;flex-wrap:wrap}
.gsearch{flex:0 1 330px;display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:42px}
.gsearch svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:1.8;flex:0 0 17px}
.gsearch input{border:0;outline:0;background:none;width:100%;font:inherit;font-size:13px;color:var(--text)}
.ibtn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.ibtn svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:1.6}
.ibtn i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--s2)}
.lsel{min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--s2);padding:0 30px 0 14px;font:inherit;font-size:13px;color:var(--text);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}
#me{display:flex;align-items:center;gap:10px;margin:0;color:var(--text)}
.usr{display:flex;align-items:center;gap:10px;cursor:pointer}
.usr img,.pimg{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--s2);box-shadow:0 0 0 1px var(--line)}
.usr b{display:block;font-size:13.5px;line-height:1.2}
.usr small{display:block;font-size:11.5px;color:var(--dim)}

/* ---------- dashboard ---------- */
.dgrid3{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.colr{display:grid;gap:16px}
.hero3{position:relative;border-radius:22px;overflow:hidden;min-height:330px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);background:linear-gradient(115deg,#FBF8F1 0%,#F3ECDF 48%,#EADFCB 100%);border:1px solid var(--line)}
.hero3 .tx{position:relative;z-index:2;padding:46px 0 40px 44px}
.hero3 .ey{font-size:10.5px;letter-spacing:.38em;color:var(--muted);line-height:1.9}
.hero3 h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4.2vw,56px);line-height:1.05;letter-spacing:.02em;margin:18px 0 18px;color:#2A2722}
.hero3 .rule{width:34px;height:1px;background:var(--text);margin-bottom:16px;opacity:.6}
.hero3 p{font-size:15px;line-height:1.75;color:#3C372F;margin:0;max-width:30ch}
.hero3 .win{position:relative;margin:18px 18px 0 0;border-radius:999px 999px 0 0;overflow:hidden;background:url(img/hero.jpg) center 40%/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.hero3 .win::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,244,222,.15),rgba(255,244,222,0) 40%,rgba(244,236,222,.55))}
.hero3 .words{position:absolute;right:22px;top:50%;transform:translateY(-50%);z-index:3;font-size:10.5px;letter-spacing:.36em;color:#fff;line-height:2.3;text-shadow:0 1px 6px rgba(60,40,10,.4);text-align:left}
.silk{position:absolute;z-index:1;pointer-events:none;left:38%;top:-10%;width:34%;height:120%;opacity:.75;animation:sway 9s ease-in-out infinite alternate;transform-origin:top center}
@keyframes sway{from{transform:skewX(-3deg) translateX(-6px)}to{transform:skewX(4deg) translateX(8px)}}
.jar{position:absolute;z-index:3;width:clamp(110px,13vw,170px);right:34%;bottom:-6px;filter:drop-shadow(0 18px 18px rgba(80,60,30,.18))}
.mugung{position:absolute;z-index:4;width:44px;right:calc(34% - 26px);bottom:12px}
.drop{position:absolute;z-index:2;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 12%,rgba(255,255,255,.35) 22%,rgba(190,170,130,.18) 60%,rgba(255,255,255,.55) 100%);box-shadow:0 3px 6px rgba(90,70,40,.15),inset 0 -2px 4px rgba(255,255,255,.6)}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:-34px;padding:0 14px;position:relative;z-index:5}
.sc4{position:relative;overflow:hidden;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:96px;text-align:left;box-shadow:var(--shadow);cursor:pointer}
.sc4::after{content:"";position:absolute;right:0;top:0;bottom:0;width:48%;background:var(--img) center/cover;-webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%);opacity:.9}
.sc4 > *{position:relative;z-index:1}
.sc4 .lb4{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.sc4 .lb4 svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.4}
.sc4 .nn{font-family:var(--serif);font-size:40px;line-height:1;font-weight:500;margin-top:8px;display:flex;align-items:baseline;gap:10px}
.sc4 .nn small{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--forest)}
.ptab{margin-top:16px}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead h2{font-size:21px;font-weight:700;margin:0;margin-right:auto}
.psearch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:38px;background:var(--s1);min-width:0;flex:0 1 260px}
.psearch svg{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:1.8;flex:0 0 15px}
.psearch input{border:0;outline:0;background:none;font:inherit;font-size:12.5px;width:100%;color:var(--text)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ptabs button{min-height:36px;padding:0 16px;border-radius:999px;background:var(--ivory);font-size:13px;color:var(--muted)}
.ptabs button b{font-weight:500;margin-left:4px;color:var(--dim)}
.ptabs button.on{background:var(--forest);color:#fff}
.ptabs button.on b{color:rgba(255,255,255,.75)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.rw{cursor:pointer}
.tbl tr.rw:hover td{background:#FBF8F1}
.tscroll{overflow-x:auto}
.pinfo{display:flex;align-items:center;gap:12px;min-width:200px}
.pinfo .pimg{width:52px;height:52px;border-radius:10px}
.pinfo b{display:block;font-size:14px}
.pinfo small{display:block;color:var(--dim);font-size:11.5px;letter-spacing:.02em}
.ptags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.ptags span{font-size:10.5px;background:var(--ivory);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.miles{display:flex;align-items:flex-start;min-width:300px}
.mile{flex:1;text-align:center;font-size:10px;color:var(--dim);position:relative;padding-top:14px;white-space:nowrap}
.mile::before{content:"";position:absolute;top:4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:1.5px solid #C9C0B1;background:var(--s2);z-index:1}
.mile::after{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:#E2DACB}
.mile:first-child::after{display:none}
.mile.d::before{background:var(--forest);border-color:var(--forest)}
.mile.d::after{background:var(--forest)}
.mile.c::before{background:var(--forest);border-color:var(--forest);box-shadow:0 0 0 4px rgba(36,74,54,.15)}
.mile.c{color:var(--forest);font-weight:700}
.nxt b{display:block;font-size:12.5px;white-space:nowrap}
.nxt span{font-size:12px;color:var(--muted)}
.cdi{display:flex;align-items:center;gap:8px;white-space:nowrap}
.cdi img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.spill{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:7px;white-space:nowrap}
.sp-consult{background:#E7EEF6;color:#3E6690}
.sp-ready{background:#FBEBD8;color:#A6662A}
.sp-korea{background:#E2EFE6;color:#2F6A47}
.sp-booked{background:var(--rose2);color:var(--rose)}
.sp-after{background:#EEE8F6;color:#6B5596}
.sp-done{background:var(--s3);color:var(--muted)}
.sp-hold{background:#F3E9E4;color:#8E6352}
.acts{display:flex;gap:6px}
.acts button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--s2);display:flex;align-items:center;justify-content:center}
.acts svg{width:15px;height:15px;stroke:var(--text);fill:none;stroke-width:1.6}
.tday h3,.wcard h3{font-size:17px;font-weight:700;margin:0}
.wcard{background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.whead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.whead .sub{color:var(--muted);font-size:13px}
.whead a,.whead .lk{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none;cursor:pointer}
.tline{position:relative;padding-left:4px}
.ti{display:grid;grid-template-columns:52px 14px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;cursor:pointer}
.ti .tm{font-family:var(--serif);font-size:16px;color:var(--muted)}
.ti .tdot{width:9px;height:9px;border-radius:50%;background:var(--forest);justify-self:center;box-shadow:0 0 0 4px var(--sage2)}
.ti .tb{display:flex;align-items:center;gap:10px;min-width:0}
.ti .tb img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 38px}
.ti b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sofia{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(120deg,#33493C,#56705E 60%,#8DA08B);color:#fff;padding:20px;min-height:150px;box-shadow:var(--shadow)}
.sofia .bust{position:absolute;right:-6px;bottom:-4px;height:118%;opacity:.95;pointer-events:none}
.sofia small{font-size:10.5px;letter-spacing:.32em;opacity:.85}
.sofia h3{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.06em;margin:2px 0 8px}
.sofia p{position:relative;font-size:13px;line-height:1.6;max-width:62%;margin:0;opacity:.95}
.sofia button{position:absolute;right:16px;bottom:16px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.7);color:#fff;font-size:16px;z-index:2}
.chatprev .cm{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.chatprev .cm:first-of-type{border-top:0}
.chatprev img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chatprev b{font-size:13px}
.chatprev span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatprev time{font-size:11px;color:var(--dim)}
.ctabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.ctabs span{font-size:11.5px;padding:4px 12px;border-radius:999px;background:var(--ivory);color:var(--muted)}
.ctabs span.on{background:var(--forest);color:#fff}
.stage2{font-size:10.5px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:600;letter-spacing:.04em}
.bot4{display:grid;grid-template-columns:1.25fr 1.15fr 1fr .95fr;gap:16px;margin-top:16px}
.wk{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));font-size:11px}
.wk .h{text-align:center;color:var(--muted);padding-bottom:6px;font-size:11.5px}
.wk .h.td{color:var(--forest);font-weight:700}
.wk .tm{color:var(--dim);height:44px;border-top:1px solid var(--line);padding-top:2px}
.wk .cl{height:44px;border-top:1px solid var(--line);border-left:1px solid var(--line);position:relative;padding:2px}
.wk .ev{display:block;border-radius:6px;padding:3px 5px;font-size:10.5px;line-height:1.25;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;width:100%}
.ev-b{background:#E7EEF6;color:#2F5680}.ev-g{background:#E2EFE6;color:#2F6A47}.ev-r{background:var(--rose2);color:var(--rose)}.ev-y{background:#FBEBD8;color:#9A5D22}.ev-p{background:#EEE8F6;color:#5E4A88}
.fin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fin .fi{display:flex;gap:10px;align-items:flex-start}
.fin .fi i{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ivory);color:var(--gold);font-style:normal;font-family:var(--serif);font-weight:600}
.fin .fi.neg i{background:var(--rose2);color:var(--rose)}
.fin small{display:block;color:var(--muted);font-size:11.5px}
.fin b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.fin em{font-style:normal;font-size:11.5px;color:var(--ok)}
.fin .neg em{color:var(--rose)}
.botmsg{display:grid;gap:8px;font-size:12px}
.botmsg .q{justify-self:end;background:var(--forest);color:#fff;border-radius:12px 12px 2px 12px;padding:7px 10px;max-width:85%}
.botmsg .a{display:flex;gap:8px;align-items:flex-start}
.botmsg .a img{width:28px;height:28px;border-radius:50%}
.botmsg .a p{margin:0;background:var(--ivory);border-radius:12px 12px 12px 2px;padding:7px 10px}
.botin{display:flex;gap:8px;margin-top:10px}
.botin input{flex:1;min-width:0;min-height:38px;border-radius:999px;border:1px solid var(--line);padding:0 14px;font:inherit;font-size:12.5px;background:var(--s1)}
.botin button{width:38px;height:38px;border-radius:50%;background:var(--forest);color:#fff}

/* pages */
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.pagehead h1{font-family:var(--serif);font-weight:500;font-size:32px;margin:0;letter-spacing:.01em}
.pagehead p{margin:0;color:var(--muted);font-size:13px}
.pagehead .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.kc small{color:var(--muted);font-size:12px}
.kc b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.hb .tr{height:12px;border-radius:6px;background:var(--ivory);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--forest),var(--sage))}
.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.soonpage{text-align:center;padding:40px 20px}
.soonpage h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:6px 0}

/* wizard */
.wz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.wzsteps{display:flex;gap:0;margin-bottom:18px}
.wzs{flex:1;text-align:center;position:relative;font-size:12px;color:var(--dim);padding-top:40px;cursor:pointer;background:none}
.wzs::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;border:1.5px solid #CFC6B6;background:var(--s2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;color:var(--muted);z-index:1}
.wzs::after{content:"";position:absolute;top:16px;left:-50%;right:50%;height:2px;background:#E2DACB}
.wzs:first-child::after{display:none}
.wzs.d::before{background:var(--sage2);border-color:var(--sage);color:var(--forest)}
.wzs.d::after,.wzs.c::after{background:var(--forest)}
.wzs.c::before{background:var(--forest);border-color:var(--forest);color:#fff;box-shadow:0 0 0 5px rgba(36,74,54,.12)}
.wzs.c{color:var(--forest);font-weight:700}
.wzside{position:sticky;top:16px}
.wzcode{font-family:var(--serif);font-size:28px;color:var(--forest);letter-spacing:.04em;margin:4px 0 2px}
.wznav{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.rv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:13px}
.rv dt{color:var(--dim)}.rv dd{margin:0}
.cbx{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.cbx:first-child{border-top:0}
.cbx input{width:20px;height:20px;accent-color:var(--forest);flex:0 0 auto}

.nav.tab{background:none;border:0;border-radius:12px;min-height:46px;padding:6px 12px;color:var(--text);font-weight:500;box-shadow:none}
.nav.tab.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(36,74,54,.25)}
.mnav .tab{background:none;border:0;border-radius:0;padding:0;box-shadow:none}
.mnav .tab.on{background:none;color:var(--forest)}
.hero3 h1{font-size:clamp(28px,2.9vw,46px);white-space:nowrap}
.ptab.lim .miles{min-width:250px}
.ptab.lim .pinfo{min-width:170px}
.ptab.lim .ptags span:nth-child(n+2){display:none}
.ptab.lim th:last-child,.ptab.lim td:last-child{display:none}
.tbl.cmp td,.tbl.cmp th{white-space:nowrap;padding:8px 6px}
.fin{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.srow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.srow:first-of-type{border-top:0}
.srow .sd{font-family:var(--serif);font-size:15px;color:var(--muted)}
.srow b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.srow .spill{display:inline-block}
.hero3{min-height:360px}
.hero3 .tx{padding-bottom:70px}
.fin b{font-size:15px}
/* mobile */
.stp{grid-template-columns:repeat(13,minmax(0,40px));justify-content:start;gap:6px}
.nav .soon{position:static;margin-left:auto;flex:0 0 auto;white-space:nowrap}
.mile{white-space:normal;line-height:1.15;padding-left:1px;padding-right:1px;overflow-wrap:anywhere}
html:not([lang="ko"]) .miles{min-width:380px}
html:not([lang="ko"]) .mile{font-size:9px}
.mnav{display:none}
.mbrand{display:none;font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.05em;color:var(--text);text-decoration:none;margin-right:auto}
@media (max-width:1000px){.mbrand{display:block}}
@media (max-width:1200px){.bot4{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid3{grid-template-columns:minmax(0,1fr) 300px}}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mainc{padding:12px 14px 92px}
  .dgrid3,.wz{grid-template-columns:minmax(0,1fr)}
  .wzside{position:static}
  .stats4{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px;padding:0}
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(251,248,242,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);min-height:48px;justify-content:center;position:relative}
  .mnav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5}
  .mnav button.on{color:var(--forest);font-weight:700}
  .mnav .bdg{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:999px;background:var(--rose);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
}
@media (max-width:760px){
  .hero3{grid-template-columns:minmax(0,1fr);min-height:0}
  .hero3 .tx{padding:26px 22px 0}
  .hero3 .win{height:200px;margin:16px 16px 0}
  .hero3 .words{display:none}
  .silk{left:20%;width:60%}
  .jar{right:12%;width:96px}.mugung{right:6%;width:34px}
  .bot4{grid-template-columns:minmax(0,1fr)}
  .gsearch{flex:1 1 100%;order:5}
  .topbar{justify-content:space-between}
  .usr div{display:none}
  .ptab .tscroll .tbl{display:none}
  .pcards{display:grid!important;gap:10px}
  .hb{grid-template-columns:90px minmax(0,1fr) 60px}
}
.pcards{display:none}
.mmore{position:fixed;inset:0;z-index:25;background:rgba(42,39,34,.35);display:flex;align-items:flex-end}
.mmore .sheet{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:80vh;overflow:auto}
.mmore .nav{background:var(--s2);border:1px solid var(--line)}

/* auth */
.auth3{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth3 .art{position:relative;background:url(img/hero.jpg) center/cover;min-height:280px}
.auth3 .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(244,239,230,0) 40%,var(--bg))}
.auth3 .art h1{position:absolute;left:36px;bottom:36px;z-index:2;font-family:var(--serif);font-weight:500;color:#fff;font-size:clamp(30px,4vw,52px);line-height:1.05;text-shadow:0 2px 12px rgba(60,40,10,.35);margin:0}
.auth3 .frm{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(18px,5vw,64px);max-width:480px}
@media (max-width:820px){.auth3{grid-template-columns:minmax(0,1fr)}.auth3 .art{min-height:220px}.auth3 .art::after{background:linear-gradient(180deg,rgba(244,239,230,0) 50%,var(--bg))}}
#auth.auth{max-width:none;margin:0}
.intakewrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.intakewrap .card{background:var(--s2)}
.intakewrap .title{color:var(--text)}
.intakewrap .title .ol{-webkit-text-stroke-color:var(--gold)}


/* ===== v3.1 · Stage 2: chat, customer messages, chatbot ===== */
.nb2{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--rose);color:#fff;font-size:11px;font-style:normal;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.chwrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;height:calc(100dvh - 150px);min-height:520px}
.chpane{background:var(--s2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.chtop{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.chtop .row{display:flex;gap:8px;align-items:center}
.chtop h3{margin:0;font-size:16px;font-family:var(--serif);font-weight:600;font-size:20px}
.chsearch{flex:1;min-width:0;min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--s1);padding:0 14px;font:inherit;font-size:13px}
.chf{display:flex;gap:6px;flex-wrap:wrap}
.chf button{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--ivory);color:var(--muted);border:1px solid transparent;min-height:30px}
.chf button.on{background:var(--forest);color:#fff}
.chf button em{font-style:normal;margin-left:4px;opacity:.85}
.chlist{overflow:auto;flex:1;min-height:0}
.chitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;cursor:pointer}
.chitem:hover{background:var(--ivory)}
.chitem.on{background:var(--sage2)}
.chitem b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chitem>div>span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chitem .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chitem time{font-size:11px;color:var(--dim)}
.chitem.em{box-shadow:inset 3px 0 0 var(--rose)}
.rav{width:44px;height:44px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--sage2);color:var(--forest);overflow:hidden;flex:none}
.rav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.rav img,.rav .av{width:100%;height:100%;object-fit:cover;border-radius:50%}
.rav.sm{width:34px;height:34px}
.rav.gold{background:var(--gold2);color:#7A5E2C}
.rav.rose{background:var(--rose2);color:var(--rose)}
.chhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chhead .t{min-width:0;flex:1}
.chhead b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chhead small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chback{display:none;width:36px;height:36px;border-radius:50%;background:var(--ivory);font-size:18px}
.chmsgs{flex:1;overflow:auto;padding:16px 16px 8px;min-height:0;background:linear-gradient(180deg,var(--paper),var(--s2) 30%)}
.chday{text-align:center;margin:14px 0 10px;font-size:11.5px;color:var(--dim)}
.chday span{background:var(--ivory);padding:3px 12px;border-radius:999px}
.cmsg{display:flex;gap:8px;align-items:flex-end;margin:3px 0;max-width:100%}
.cmsg .who{font-size:11.5px;color:var(--muted);margin:6px 0 2px 2px;display:block}
.cmsg .bub{background:var(--s1);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-width:min(520px,78vw)}
.cmsg .bub a{color:var(--forest2);text-decoration:underline}
.cmsg time{font-size:10.5px;color:var(--dim);white-space:nowrap;padding-bottom:2px}
.cmsg .avs{width:30px;flex:none}
.cmsg .avs img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.cmsg.me{flex-direction:row-reverse}
.cmsg.me .bub{background:var(--forest);color:#fff;border-color:var(--forest);border-radius:16px 16px 4px 16px}
.cmsg.me .bub a{color:#fff}
.cmsg.bot .bub{background:var(--ivory);border-color:var(--gold2)}
.cmsg.sys{justify-content:center}
.cmsg.sys .bub{background:var(--gold2);border:0;color:#5E4720;font-size:12px;border-radius:999px;padding:5px 14px}
.cmsg .col{display:flex;flex-direction:column;min-width:0}
.cmsg.me .col{align-items:flex-end}
.chimg{max-width:240px;max-height:240px;border-radius:12px;display:block;background:var(--ivory);min-width:80px;min-height:60px;cursor:zoom-in;object-fit:cover}
.chfile{display:inline-flex;gap:8px;align-items:center;background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--text);max-width:260px;text-align:left}
.cmsg.me .chfile{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.chfile b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trl{font-size:11px;color:var(--forest2);margin-left:4px;text-decoration:underline;cursor:pointer;background:none}
.chcomp{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:var(--s2)}
.chcomp textarea{flex:1;min-width:0;resize:none;min-height:44px;max-height:140px;border-radius:22px;border:1px solid var(--line);background:var(--s1);padding:11px 16px;font:inherit;font-size:14px;line-height:1.4}
.chcomp .ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ivory);flex:none;cursor:pointer}
.chcomp .ib svg{width:20px;height:20px;stroke:var(--forest);fill:none;stroke-width:1.6}
.chcomp .send{background:var(--forest)}
.chcomp .send svg{stroke:#fff}
.chempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);gap:10px}
.chempty .jarw{width:110px;opacity:.9}
.chempty .jarw svg,.chempty .jar{position:static!important;width:100%!important;height:auto!important;inset:auto!important;transform:none!important}
.chnew{padding:14px;overflow:auto;flex:1}
.chnew .pick{display:grid;gap:6px;margin-top:10px}
.chnew .pick button,.chnew .pick label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--s1);text-align:left;cursor:pointer}
.chnew .pick img{width:34px;height:34px;border-radius:50%}
.chnew .pick small{color:var(--muted);margin-left:auto;font-size:11.5px}
.tinfo{display:flex;gap:6px 14px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--paper)}
.tinfo b{color:var(--text);font-weight:600}
.tact{display:flex;gap:6px;flex-wrap:wrap}
.spl{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--ivory);color:var(--muted)}
.spl.waiting{background:var(--rose2);color:var(--rose)}
.spl.open{background:var(--sage2);color:var(--forest)}
.spl.bot{background:var(--gold2);color:#6C5226}
.spl.closed{background:#ECE8E1;color:#8A8377}
.spl.approved{background:var(--sage2);color:var(--forest)}
.spl.draft{background:var(--gold2);color:#6C5226}
.spl.hidden{background:#ECE8E1;color:#8A8377}
.lgc{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--sky);color:#3D5A73}
.faqsel{max-width:180px;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--ivory);padding:0 10px;font:inherit;font-size:12px}
.notice{background:var(--gold2);color:#5E4720;border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.notice code{background:rgba(255,255,255,.6);padding:1px 6px;border-radius:6px}
/* bot admin */
.bgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.links{display:grid;gap:8px}

/* ---------- storage ---------- */
S.urls={};S.urlPending=new Set();
const urlOf=p=>(S.urls[p]&&S.urls[p].exp>Date.now())?S.urls[p].url:"";
async function fetchUrls(paths){
  paths=[...new Set(paths)].filter(p=>p&&!urlOf(p)&&!S.urlPending.has(p));if(!paths.length)return false;
  paths.forEach(p=>S.urlPending.add(p));
  let res;try{res=await sb.storage.from(BUCKET).createSignedUrls(paths,3600)}catch(e){res={error:e}}
  paths.forEach(p=>S.urlPending.delete(p));
  if(res.error||!res.data)return false;
  res.data.forEach(d=>{if(d.signedUrl)S.urls[d.path]={url:d.signedUrl,exp:Date.now()+3300e3}});return true;
}
function paintUrls(){document.querySelectorAll("img[data-path]").forEach(i=>{const u=urlOf(i.dataset.path);if(u&&i.getAttribute("src")!==u)i.src=u})}
function wantUrls(){const ps=[...document.querySelectorAll("img[data-path]")].map(i=>i.dataset.path);paintUrls();fetchUrls(ps).then(ok=>{if(ok)paintUrls()})}
const isImg=f=>/^image\//.test(f.mime||"")||/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name||"");
const fmtSize=b=>!b?"":b>1048576?(b/1048576).toFixed(1)+"MB":Math.max(1,Math.round(b/1024))+"KB";
function storageErr(e){const m=(e&&e.message||"")+"";return /bucket|not found|policy|row-level|security/i.test(m)?"Supabase에 labelle_v16.sql을 먼저 실행해 주세요.":"업로드 실패: "+m}
async function upFile(r,file,prefix=""){
  const safe=(file.name||"file").replace(/[^\w.\-]+/g,"_").slice(-60);
  const path=`${r.id}/${prefix}${Date.now()}-${uid()}-${safe}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
  if(error)throw error;return path;
}
async function shrink(file,max=640){
  if(!/^image\//.test(file.type||""))return file;
  try{const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);const b=await new Promise(res=>c.toBlob(res,"image/jpeg",.86));return b?new File([b],"profile.jpg",{type:"image/jpeg"}):file}catch(e){return file}
}
function avatar(r,lg){const ini=esc((r.name||"?").trim().slice(0,1).toUpperCase());
  return r.profile_path?`<img class="av ${lg?"lg":""}" data-path="${esc(r.profile_path)}" alt="">`:`<span class="av ${lg?"lg":""}">${ini}</span>`}
async function setProfile(r,file){
  if(!file)return;toast("사진 올리는 중…");
  try{const small=await shrink(file);const path=await upFile(r,small,"profile-");const old=r.profile_path;
    if(await patch(r,{profile_path:path},"프로필 사진 변경")){if(old)sb.storage.from(BUCKET).remove([old]);toast("프로필 사진이 저장되었습니다.");render()}
  }catch(e){toast(storageErr(e))}
}

async function signIn(up){
  let email=$("#aEmail").value.trim().toLowerCase();const password=$("#aPass").value;
  if(email&&!email.includes("@"))email+=LOGIN_DOMAIN;
  if(up&&password.length<6){$("#aMsg").textContent="비밀번호는 6자 이상이어야 합니다.";return}
  if(!email||!password){$("#aMsg").textContent="이메일과 비밀번호를 입력하세요.";return}
  $("#aMsg").textContent="확인 중…";
  const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){const m=(r.error.message||"").toLowerCase();
    $("#aMsg").textContent=up?(m.includes("registered")||m.includes("exists")?"이미 있는 계정입니다. 로그인을 눌러 주세요.":m.includes("signup")||m.includes("not allowed")?"새 계정 만들기가 꺼져 있습니다. 관리자에게 요청하세요.":"계정을 만들 수 없습니다: "+r.error.message)
      :(m.includes("invalid")?"아이디 또는 비밀번호가 맞지 않습니다. 처음이라면 ‘계정 만들기’를 누르세요.":m.includes("confirm")?"이메일 인증이 필요합니다. 관리자에게 요청하세요.":"로그인 실패: "+r.error.message);
    console.log("auth error",email,r.error);return}
  S.user=r.data.user||r.data.session?.user;showApp();
}

async function patch(r,p,logText){
  if(logText){p.log=[{at:nowStamp(),text:logText+(S.user?" · "+who():"")},...(r.log||[])].slice(0,200)}
  const {error}=await sb.from(T).update(p).eq("id",r.id);

function readForm(){
  const pick=f=>{const b=document.querySelector(`.chips[data-field="${f}"] .chip.on`);return b?b.dataset.v:null};
  const num=id=>{const x=$(id).value.replace(/[^\d]/g,"");return x?Number(x):null};
  return {name:$("#fName").value.trim(),nationality:pick("nationality"),language:pick("language"),contact:$("#fContact").value.trim()||null,
    counselor:$("#fCounselor").value.trim()||null,department:pick("department"),procedure:$("#fProc").value.trim()||null,hospital:$("#fHosp").value.trim()||null,
    interpreter:$("#fInterp").value.trim()||null,program:$("#fProgram").value.trim()||null,
    payment_method:[...document.querySelectorAll('.chips[data-field="payment_method"] .chip.on')].map(b=>b.dataset.v).join(", ")||null,
    agency:(pick("agency")&&pick("agency")!=="직접 유치")?pick("agency"):null,
    source:pick("source"),tier:pick("tier")||"일반고객",stage:Number(pick("stage")||0),
    arrival_date:$("#fArr").value||null,surgery_date:$("#fSurg").value||null,departure_date:$("#fDep").value||null,
    quote_krw:num("#fQuote"),paid_krw:num("#fPaid"),notes:$("#fNotes").value.trim()||null};
}
function bindForm(r){
  const always=["stage","evtype","fkind","agency","tier"];
  const prev=()=>{const cp=$("#codePrev");if(!cp||(r&&r.patient_code))return;
    const nat=document.querySelector('.chips[data-field="nationality"] .chip.on')?.dataset.v;const ag=document.querySelector('.chips[data-field="agency"] .chip.on')?.dataset.v;
    cp.textContent=nextCode(codePrefix(nat,agCode(ag)))};
  const bindChips=()=>document.querySelectorAll(".chips").forEach(g=>g.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;
    if(g.classList.contains("multi")){b.classList.toggle("on");return}
    const was=b.classList.contains("on");g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    if(!was||always.includes(g.dataset.field))b.classList.add("on");
    if(g.dataset.field==="coord"&&$("#fCounselor"))$("#fCounselor").value=b.classList.contains("on")?b.dataset.v:"";prev()});
  bindChips();prev();
  const bindAg=()=>{
    const o=$("#agOpen");if(o)o.onclick=()=>{S.agNew=true;redrawAg()};
    const c=$("#agCancel");if(c)c.onclick=()=>{S.agNew=false;redrawAg()};
    const sv2=$("#agSave");if(sv2)sv2.onclick=async()=>{
      const name=$("#agName").value.trim(),cd=$("#agCode").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(!name||cd.length<2){toast("이름과 코드(영문 2~4자)를 입력하세요.");return}
      if(agencyList().some(a=>a.code===cd)||cd==="LB"){toast("이미 사용 중인 코드입니다.");return}
      const nat=document.querySelector('.chips[data-field="nationality"] .chip.on')?.dataset.v||null;
      const {data,error}=await sb.from("labelle_agencies").insert({name,code:cd,country:nat}).select().single();
      if(error){toast(/relation|exist|schema/i.test(error.message)?"Supabase에 labelle_v16.sql을 먼저 실행해 주세요.":"저장 실패: "+error.message);return}
      S.agencies=[...(S.agencies||[]),data];S.agNew=false;redrawAg(name);toast("에이전시가 추가되었습니다.");
    }};
  const redrawAg=(sel)=>{const box=$("#agBox");if(!box)return;const cur=sel||document.querySelector('.chips[data-field="agency"] .chip.on')?.dataset.v;
    box.innerHTML=agencyBox({agency:cur==="직접 유치"?null:cur});bindChips();bindAg();prev()};
  bindAg();
  document.querySelectorAll("input.dt").forEach(i=>i.oninput=()=>{const c=document.querySelector(`.confirm[data-for="${i.id}"]`);if(c)c.textContent=i.value?"→ "+fFull(i.value):""});
  const sv=$("#fSave");if(!sv)return;
  sv.onclick=async()=>{
    const v=readForm();
    if(!v.name){toast("이름을 입력하세요.");$("#fName").focus();return}
    if(!r){
      const dup=active().find(x=>x.name.trim().toLowerCase()===v.name.toLowerCase()||(v.contact&&x.contact===v.contact));
      if(dup&&!S.dupArm){S.dupArm=true;$("#dupWarn").innerHTML=`<div class="warnbox">이미 등록된 환자와 비슷합니다: <b>${esc(dup.name)}</b> (${code(dup)}). 그래도 등록하려면 저장을 한 번 더 누르세요.</div>`;scrollTo(0,0);return}
      sv.disabled=true;
      const prefix=codePrefix(v.nationality,agCode(v.agency));v.agency_code=v.agency?agCode(v.agency):null;
      let data,error;
      for(let k=0;k<4;k++){v.patient_code=nextCode(prefix,k);
        ({data,error}=await TI.insert({...v,events:[],log:[{at:nowStamp(),text:`환자 등록 · ${v.patient_code} · ${who()}`}],status:"active"}).select().single());
        if(!error||!/duplicate|unique/i.test(error.message||""))break}
      if(error){sv.disabled=false;toast(/column|schema/i.test(error.message||"")?"Supabase에 labelle_v16.sql을 먼저 실행해 주세요.":"저장 실패: "+error.message);return}
      const row={...data,events:data.events||[],log:data.log||[],files:data.files||[]};S.rows.unshift(row);S.dupArm=false;
      const ph=$("#fPhoto")?.files?.[0],att=[...($("#fAttach")?.files||[])],ak=$("#fAttKind")?.value||"기타";
      if(ph)await setProfile(row,ph);
      if(att.length)await addFiles(row,att,{kind:ak,date:today(),title:"",note:""});
      sv.disabled=false;
      toast(`등록되었습니다 · ${row.patient_code}`);S.tab="home";S.openId=data.id;render();scrollTo(0,0);
    }else{
      const ch=[];if(v.stage!==(r.stage||0))ch.push(`단계: ${STAGES[r.stage||0]} → ${STAGES[v.stage]}`);if(v.tier!==tierOf(r))ch.push(`고객 레벨: ${tierOf(r)} → ${v.tier}`);
      [["surgery_date","수술일"],["arrival_date","입국일"],["departure_date","출국일"]].forEach(([k,l])=>{if((v[k]||null)!==(r[k]||null))ch.push(`${l}: ${r[k]?fD(r[k]):"없음"} → ${v[k]?fD(v[k]):"없음"}`)});
      if(!r.patient_code){v.patient_code=nextCode(codePrefix(v.nationality,agCode(v.agency)));ch.push("코드 발급 "+v.patient_code)}
      v.agency_code=v.agency?agCode(v.agency):null;
      const att=[...($("#fAttach")?.files||[])],ak=$("#fAttKind")?.value||"기타";
      if(await patch(r,v,"정보 수정"+(ch.length?" · "+ch.join(", "):""))){if(att.length)await addFiles(r,att,{kind:ak,date:today(),title:"",note:""});S.editing=false;toast("저장되었습니다.");render()}
    }
  };
  const c=$("#fClose");if(c)c.onclick=()=>{S.editing=false;render()};
}

async function addFiles(r,list,meta){
  const ok=[];let i=0;
  for(const file of list){i++;
    if(file.size>MAXMB*1048576){toast(`${file.name}: ${MAXMB}MB를 넘어 건너뜁니다.`);continue}
    toast(`업로드 중 ${i}/${list.length} · ${file.name}`);
    try{const path=await upFile(r,file,MEDK.has(meta.kind)?"med-":"");ok.push({id:uid(),kind:meta.kind,date:meta.date,title:meta.title&&list.length===1?meta.title:(meta.title?meta.title+" "+i:file.name),note:meta.note,shared:false,path,name:file.name,size:file.size,mime:file.type||""})}
    catch(e){toast(storageErr(e));return false}
  }
  if(!ok.length)return false;
  return await patch(r,{files:[...(r.files||[]),...ok]},`파일 첨부 ${ok.length}개: ${ok.map(f=>f.title).join(", ").slice(0,80)} (${meta.kind})`);
}
function sampleFiles(r,preview){

  return out;
}

function bindLeads(){
  document.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{S.leadF=b.dataset.lf;render()});
  document.querySelectorAll("[data-claim]").forEach(b=>b.onclick=async()=>{const l=S.leads.find(x=>x.id===b.dataset.claim);
    if(await updLead(l,{claimed_by:meName(),claimed_at:new Date().toISOString(),status:"claimed",coordinator:l.coordinator||meName()})){toast("내 상담으로 가져왔습니다.");S.leadF="mine";render()}});
  document.querySelectorAll("[data-lco]").forEach(b=>b.onclick=()=>{S.leadCo=b.dataset.lco;render()});
  if(S.leadCo){const l=S.leads.find(x=>x.id===S.leadCo);if(l)bindConsultForm({lead_id:l.id,patient_id:l.patient_id||null,subject:l.name})}
  document.querySelectorAll("[data-lclose]").forEach(b=>b.onclick=async()=>{const id=b.dataset.lclose;if(S.arm!=="l"+id){S.arm="l"+id;render();return}S.arm=null;
    const l=S.leads.find(x=>x.id===id);if(await updLead(l,{status:"closed"})){toast("종료되었습니다.");render()}});
  document.querySelectorAll("[data-conv]").forEach(b=>b.onclick=()=>convertLead(S.leads.find(x=>x.id===b.dataset.conv)));
}
async function convertLead(l){
  const o=leadOwner(l)||meName();
  const lang={mn:"몽골어",pt:"포르투갈어",en:"영어",zh:"중국어",ko:"한국어"}[l.form_lang]||null;
  const consent={privacy:l.consent_privacy,sensitive:l.consent_sensitive,third:l.consent_third,overseas:!!l.consent_overseas,marketing:!!l.consent_marketing,version:l.consent_version,at:l.created_at,lead_id:l.id};
  const v={name:l.name,nationality:l.nationality||null,language:lang,contact:[l.phone,l.messenger&&`${l.messenger} ${l.messenger_id||""}`.trim(),l.email].filter(Boolean).join(" / ")||null,
    department:l.department||null,procedure:l.procedure||null,counselor:o,source:l.coord_slug?"상담 링크":"홈페이지",tier:"잠재고객",stage:0,notes:[l.message,l.birth&&"생년월일 "+l.birth,l.gender,l.visit_month&&"희망 방문 "+l.visit_month].filter(Boolean).join(" · ")||null,
    consent,lead_id:l.id,status:"active",events:[],files:[]};
  const prefix=codePrefix(v.nationality,"LB");let data,error;
  for(let k=0;k<4;k++){v.patient_code=nextCode(prefix,k);v.log=[{at:nowStamp(),text:`신규 문의에서 환자 등록 · ${v.patient_code} · 개인정보 동의 ${fD(iso(new Date(l.created_at)))} · ${who()}`}];
    ({data,error}=await TI.insert(v).select().single());if(!error||!/duplicate|unique/i.test(error.message||""))break}
  if(error){toast(/column|schema/i.test(error.message||"")?"Supabase에 labelle_v17.sql을 먼저 실행해 주세요.":"저장 실패: "+error.message);return}
  S.rows.unshift({...data,events:data.events||[],log:data.log||[],files:data.files||[]});
  await updLead(l,{status:"converted",patient_id:data.id,claimed_by:l.claimed_by||o});
  sb.from("labelle_consults").update({patient_id:data.id}).eq("lead_id",l.id).then(()=>{});S.consults.forEach(c=>{if(c.lead_id===l.id)c.patient_id=data.id});
  toast(`환자로 등록되었습니다 · ${data.patient_code}`);S.tab="home";S.openId=data.id;S.secOpen.add("info");render();scrollTo(0,0);
}

function renderIntake(){
  const box=$("#intake");box.innerHTML=intakeHTML();box.hidden=false;
  box.querySelectorAll("[data-il]").forEach(b=>b.onclick=()=>{IN.lang=b.dataset.il;renderIntake()});
  const ag=$("#inAgain");if(ag)ag.onclick=()=>{IN.done=false;renderIntake()};
  box.querySelectorAll(".chips").forEach(g=>g.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const was=b.classList.contains("on");g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));if(!was)b.classList.add("on")});
  const all=$("#cAll");if(all){all.onchange=()=>box.querySelectorAll("[data-cons]").forEach(c=>c.checked=all.checked);
    box.querySelectorAll("[data-cons]").forEach(c=>c.onchange=()=>{all.checked=[...box.querySelectorAll("[data-cons]")].every(x=>x.checked)})}
  const sd=$("#iSend");if(!sd)return;
  sd.onclick=async()=>{
    const t=FT[IN.lang],err=$("#iErr");const v=id=>$(id).value.trim();
    const c=k=>box.querySelector(`[data-cons="${k}"]`).checked;
    if(!v("#iName")){err.textContent=t.errName;return}
    if(!v("#iPhone")&&!v("#iMsgrId")&&!v("#iEmail")){err.textContent=t.errContact;return}
    if(!c("privacy")||!c("sensitive")||!c("third")){err.textContent=t.errConsent;return}
    err.textContent="";sd.disabled=true;sd.textContent=t.sending;
    const pick=f=>box.querySelector(`.chips[data-field="${f}"] .chip.on`)?.dataset.v||null;
    const row={form_lang:IN.lang,name:v("#iName"),birth:$("#iBirth").value||null,gender:$("#iGender").value||null,nationality:pick("inat"),phone:v("#iPhone")||null,
      messenger:$("#iMsgr").value||null,messenger_id:v("#iMsgrId")||null,email:v("#iEmail")||null,department:pick("idept"),procedure:v("#iProc")||null,visit_month:$("#iVisit").value||null,message:v("#iMsg")||null,
      coord_slug:IN.slug||null,coordinator:IN.coord?.name||null,consent_privacy:true,consent_sensitive:true,consent_third:true,consent_overseas:c("overseas"),consent_marketing:c("marketing"),consent_version:"2026-10-v1",status:"new"};
    const {error}=await sb.from("labelle_leads").insert(row);
    sd.disabled=false;sd.textContent=t.submit;
    if(error){err.textContent="Error: "+error.message;return}
    IN.done=true;renderIntake();scrollTo(0,0);
  };
}

async function markRead(id){

async function sendMsg(){

async function sendFile(file){
  if(!file||!CH.room)return;
  if(file.size>50*1048576){toast("파일은 50MB까지 올릴 수 있습니다.");return}
  const rid=CH.room;toast("파일 올리는 중…");
  try{
    if(/^image\//.test(file.type||"")&&file.size>2.5*1048576){const s=await shrink(file,1800);if(s!==file)file=new File([s],(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"})}
    const safe=(file.name||"file").replace(/[^\w.\-]+/g,"_").slice(-60);
    const path=`chat/${rid}/${Date.now()}-${uid()}-${safe}`;
    const up=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
    if(up.error)throw up.error;
    const {data,error}=await sb.from("labelle_msgs").insert({room_id:rid,sender:myEmail(),sender_name:meName(),file_path:path,file_name:file.name,file_size:file.size}).select().single();
    if(error)throw error;addMsg(data);paintChat();scrollBottom("#chMsgs");markRead(rid);toast("파일을 보냈습니다.");
  }catch(e){toast(/row-level|policy|bucket/i.test(e.message||"")?storageErr(e):v22Err(e))}
}
async function openChatFile(path){

}
async function mkRoom(row){

function bindChat(){

    if(k==="new"){CH.newOpen=true;CH.room=null;CH.newQ="";CH.newSel=new Set();CH.newName="";paintChat();$("#chMain").innerHTML=convHTML();bindChat()}
    else if(k==="closenew"||k==="back"){CH.newOpen=false;CH.room=null;paintChat();$("#chMain").innerHTML=convHTML();bindChat()}

      const r=await mkRoom({kind:"group",name:nm,members:[myEmail(),...CH.newSel]});if(r){toast("그룹을 만들었습니다.");openRoom(r.id)}}
    else if(k==="delroom"){const r=CH.rooms.find(x=>x.id===CH.room);if(!r)return;if(CH.armDel!==r.id){CH.armDel=r.id;$("#chMain").innerHTML=convHTML();bindChat();scrollBottom("#chMsgs");setTimeout(()=>{if(CH.armDel===r.id){CH.armDel=null;if(CH.room===r.id){$("#chMain").innerHTML=convHTML();bindChat();scrollBottom("#chMsgs")}}},4000);return}
      const {error}=await sb.from("labelle_rooms").delete().eq("id",r.id);if(error){toast(v22Err(error));return}CH.rooms=CH.rooms.filter(x=>x.id!==r.id);CH.room=null;CH.armDel=null;toast("삭제되었습니다.");paintChat();$("#chMain").innerHTML=convHTML();bindChat()}
  });
  w.querySelectorAll("[data-nk]").forEach(b=>b.onclick=()=>{CH.newKind=b.dataset.nk;CH.newQ="";$("#chMain").innerHTML=convHTML();bindChat()});
  const nq=$("#ncQ");if(nq)nq.oninput=()=>{CH.newQ=nq.value;const pos=nq.selectionStart;$("#chMain").innerHTML=convHTML();bindChat();const n=$("#ncQ");n.focus();n.setSelectionRange(pos,pos)};
  const ng=$("#ngName");if(ng)ng.oninput=()=>CH.newName=ng.value;
  w.querySelectorAll("[data-gm]").forEach(c=>c.onchange=()=>{const e=c.dataset.gm.toLowerCase();c.checked?CH.newSel.add(e):CH.newSel.delete(e)});
  w.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>openDM(b.dataset.dm));
  w.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>openPatientRoom(b.dataset.pr));
  w.querySelectorAll("[data-chfile]").forEach(b=>b.onclick=()=>openChatFile(b.dataset.chfile));
  const ta=$("#chIn");
  if(ta){const grow=()=>{ta.style.height="";ta.style.height=Math.min(140,ta.scrollHeight)+"px"};
    ta.oninput=()=>{CH.draft[CH.room]=ta.value;grow()};
    ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}};
    ta.onfocus=()=>markRead(CH.room)}
  const sd=$("#chSend");if(sd)sd.onclick=sendMsg;
  const f=$("#chFile");if(f)f.onchange=()=>{const x=f.files[0];f.value="";sendFile(x)};
}

  const f=CH.tf;
  return CH.threads.filter(t=>f==="all"?true:f==="active"?(t.status==="waiting"||t.status==="open"):t.status===f);
}
function threadItem(t){
  return `<button class="chitem ${CH.thread===t.id?"on":""} ${t.emergency?"em":""}" data-th="${t.id}"><span class="rav ${t.emergency?"rose":t.status==="waiting"?"gold":""}" style="font-size:20px">${FLAG[t.lang]||"🌐"}</span>
   <div style="min-width:0"><b data-notr>${esc(tName(t))}${t.emergency?" ⚠":""}</b><span><span class="lgc">${LANGNM[t.lang]||"—"}</span> ${t.coordinator?`→ <span data-notr>${esc(t.coordinator)}</span>`:"공용 링크"}${t.assigned?` · 담당 <span data-notr>${esc(t.assigned)}</span>`:""}</span></div>
   <div class="rt"><time>${ago(t.last_at)}</time><span class="spl ${t.status}">${TST[t.status]||t.status}</span>${t.staff_unread&&t.status!=="bot"?`<em class="nb2">${t.staff_unread}</em>`:""}</div></button>`;
}
function msgListHTML(){
  const c=k=>CH.threads.filter(t=>k==="active"?(t.status==="waiting"||t.status==="open"):t.status===k).length;
  const f=[["active","진행"],["waiting","상담원 요청"],["bot","챗봇만"],["closed","종료"],["all","전체"]];
  const list=threadsFiltered();
  return `<div class="chtop"><div class="row"><h3>고객 메시지</h3><button class="btn sm ghost" style="margin-left:auto" data-go="bot">챗봇 관리</button></div>
   <div class="chf">${f.map(([k,l])=>`<button class="${CH.tf===k?"on":""}" data-tf="${k}">${l}${k!=="all"&&c(k)?`<em>${c(k)}</em>`:""}</button>`).join("")}</div></div>
   <div class="chlist" id="thList">${list.length?list.map(threadItem).join(""):`<div class="chempty"><span class="small">${CH.tf==="active"?"진행 중인 고객 대화가 없습니다.":"대화가 없습니다."}</span><span class="small dim">고객 챗봇 링크를 공유하면 이곳에 대화가 쌓입니다.</span></div>`}</div>`;
